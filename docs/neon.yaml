# kubectl apply -f neon.yaml
---
# 创建namespace neon
apiVersion: v1
kind: Namespace
metadata:
  name: neon

---
# MinIO / S3 —— 对象存储的**唯一事实来源**
# 既提供凭证（AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY），也提供连接坐标
# （BUCKET_NAME / AWS_REGION / AWS_ENDPOINT_URL）。
# 坐标不再通过 values 传递：pageserver 的 remote_storage 无环境变量覆盖机制，
# 由 init 容器在 Pod 启动时读出本 Secret 后写入 pageserver.toml。
# endpoint 可留空（留空走 AWS S3 官方 endpoint）；BUCKET_NAME 与 AWS_REGION 必填非空。
apiVersion: v1
kind: Secret
metadata:
  name: bucket-credentials
  namespace: neon
stringData:
  AWS_ACCESS_KEY_ID: "minioadmin"
  AWS_ENDPOINT_URL: "http://192.168.232.128:9000"
  AWS_REGION: "us-east-1"
  AWS_SECRET_ACCESS_KEY: "minioadmin"
  BUCKET_NAME: "neondata"

---
# 数据库连接（storage-controller 元数据后端）
# 由集群侧预建，chart 只"引用"：默认名 storage-controller-pg-cluster、默认键 uri，
# 对应 global.storageController.databaseUrl.existingSecret / secretKey
# （子 chart 独立部署时用 settings.databaseUrlSecretName / databaseUrlSecretKey）。
# 轮换连接串后需 kubectl rollout restart deploy/<release>-storage-controller，
# 因为 env 注入的 Secret 在运行期不会自动更新。
apiVersion: v1
kind: Secret
metadata:
  name: storage-controller-pg-cluster
  namespace: neon
type: Opaque
stringData:
  uri: "postgres://storage_controller:storage_controller@192.168.232.128:5432/storage_controller"