name: Release Charts

on:
  push:
    branches:
      - develop
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write  # helm/chart-releaser-action 发布 chart 并创建 release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.14.0

      - name: Add upstream Helm repos and update dependencies
        run: |
          helm repo add neondatabase https://neondatabase.github.io/helm-charts
          helm repo update
          # 为所有含依赖的 chart 更新本地依赖，确保 helm package 能打包
          for chart_dir in charts/*/; do
            if [ -f "${chart_dir}Chart.yaml" ] && grep -q "dependencies:" "${chart_dir}Chart.yaml" 2>/dev/null; then
              echo "Updating dependencies for ${chart_dir}"
              helm dependency update "${chart_dir}" || echo "  (dependency update skipped for ${chart_dir})"
            fi
          done

      - name: Sync gh-pages branch
        run: |
          # 同步远端 gh-pages 到本地，避免 cr upload 出现 non-fast-forward
          git fetch origin gh-pages
          git branch -f gh-pages origin/gh-pages

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Deploy index.html to gh-pages
        run: |
          git fetch origin gh-pages
          git checkout gh-pages
          # 从 develop 分支提取 index.html，与 gh-pages 上当前版本做 diff
          # 仅在内容有变化时才提交推送，避免无意义的空 commit
          if ! git show develop:assets/index.html | diff -q - index.html >/dev/null 2>&1; then
            echo "index.html changed, updating..."
            git show develop:assets/index.html > index.html
            git add index.html
            git commit -m "Update landing page"
            git push origin gh-pages
          else
            echo "index.html unchanged, skipping deploy"
          fi
