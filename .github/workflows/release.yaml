name: Release Charts

on:
  push:
    branches:
      - develop
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write  # helm/chart-releaser-action 发布 chart 并创建 release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.14.0

      - name: Add upstream Helm repos and update dependencies
        run: |
          helm repo add neondatabase https://neondatabase.github.io/helm-charts
          helm repo update
          # 为所有含依赖的 chart 更新本地依赖，确保 helm package 能打包
          for chart_dir in charts/*/; do
            if [ -f "${chart_dir}Chart.yaml" ] && grep -q "dependencies:" "${chart_dir}Chart.yaml" 2>/dev/null; then
              echo "Updating dependencies for ${chart_dir}"
              helm dependency update "${chart_dir}" || echo "  (dependency update skipped for ${chart_dir})"
            fi
          done

      - name: Prepare gh-pages branch
        run: |
          # 确保 gh-pages 分支存在，避免 cr upload 因分支缺失而失败
          if git fetch origin gh-pages 2>/dev/null; then
            echo "gh-pages branch exists on remote, syncing locally"
            git branch -f gh-pages origin/gh-pages
          else
            echo "gh-pages branch not found on remote, creating empty orphan branch"
            git checkout --orphan gh-pages
            git rm -rf --quiet . 2>/dev/null || true
            git commit --allow-empty -m "init gh-pages branch"
            git checkout "${GITHUB_REF_NAME}"
          fi

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
