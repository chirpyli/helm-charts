# Default values for neon-control-plane.
# 控制面服务：对外提供project/branch/endpoint API。

# 全局配置（umbrella 化时由父 chart 的 global 覆盖）
global: {}

image:
  # -- 控制面镜像（由 charts/neon-control-plane/src 自行构建并推送到私有仓库）
  repository: 192.168.232.128:5000/neondatabase/neon-control-plane
  pullPolicy: Always
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

settings:
  # -- storage_controller 服务地址
  storageControllerUrl: "http://neon-storage-controller-svc:50051"
  # -- 控制面自身监听端口
  listenPort: 8080
  # -- 共享 JWT Secret 名称（外部预建，键契约见 charts/neon/templates/NOTES.txt）。
  # 控制面是唯一需要 privateKey.pem 的组件（持有私钥用于签发 token），
  # 部署时只投影 privateKey.pem 与 publicKey.pem，不投影任何 token 键，遵循最小权限。
  # 留空时回退 global.jwt.existingSecret > global.jwt.secretName；三者皆空表示不使用 JWT。
  # 默认值必须保持空串：非空会让父级传入的 existingSecret 永远无法生效。
  jwtSecretName: ""
  computeImage: "neondatabase/compute-node-v17:latest"
  # -- 动态拉起的 compute Service 类型：ClusterIP（默认，仅集群内可达）或 NodePort（集群外直连）。
  # 选 NodePort 时，返回给用户的连接串会改为 <nodePortExternalHost>:<nodePort>，
  # 方便没有 proxy / LoadBalancer 的单机裸机环境直连 compute。
  computeServiceType: ClusterIP
  # -- NodePort 模式下对外的可达主机地址（节点 IP / 域名 / 负载均衡器 VIP）。
  # 仅当 computeServiceType=NodePort 时使用，用于拼接到返回给用户的连接串。
  # 为空时回退为 localhost（仅同机直连排查可用）。
  nodePortExternalHost: ""
  # -- proxy 兼容接口域名（phase-2 启用 proxy 时使用）
  domain: "neon.local"

# ---------------- 卸载清理（pre-delete 钩子） ----------------
# 控制面在运行期通过 K8s API 动态创建的资源（compute Deployment/Service、
# 状态 ConfigMap neon-cp-state）不在 Helm 清单中，helm uninstall 默认不会回收。
# 本 chart 内置一个 pre-delete 钩子 Job，卸载前自动清理这些资源，无需额外开关。
cleanup:
  image:
    # -- 清理钩子使用的镜像（需包含 kubectl）；私有仓库环境可通过 --set 覆盖
    repository: public.ecr.aws/bitnami/kubectl
    tag: "1.26"
    pullPolicy: IfNotPresent
  # -- 清理钩子 Job 的资源配额（清理动作很轻，默认给极小值即可）
  resources:
    limits:
      cpu: "100m"
      memory: 128Mi
    requests:
      cpu: "100m"
      memory: 128Mi

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: "100m"
    memory: 128Mi
  requests:
    cpu: "100m"
    memory: 128Mi

# 单副本（plan 要求单写者 + Recreate）；PDB 保证至少 1 个可用
podDisruptionBudget:
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""

metrics:
  enabled: false
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: 10s
    scrapeTimeout: 10s
    selector: {}

extraManifests: []
