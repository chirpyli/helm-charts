{{/*
共享 JWT Secret 名称：取值链见 _helpers.tpl 的 neon-control-plane.jwtSecretName。
控制面是唯一需要 privateKey.pem 的组件（持有私钥用于签发 token）。
*/}}
{{- $jwtSecret := include "neon-control-plane.jwtSecretName" . -}}
{{- $backend := dig "backend" "postgres" (.Values.settings.stateStore | default dict) -}}
{{- $dbSecret := include "neon-control-plane.databaseUrlSecretName" . -}}
{{- $dbSecretKey := include "neon-control-plane.databaseUrlSecretKey" . -}}
{{- if and (eq $backend "postgres") (not $dbSecret) -}}
{{- fail "未配置控制面数据库连接串 Secret：请设置 global.controlPlane.databaseUrl.existingSecret 或 settings.stateStore.databaseUrlSecretName" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "neon-control-plane.fullname" . }}
  labels:
    {{- include "neon-control-plane.labels" . | nindent 4 }}
spec:
  # 单副本 + Recreate（阶段 1-3 单写者约束；多副本 HA 属阶段 4）
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "neon-control-plane.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "neon-control-plane.selectorLabels" . | nindent 8 }}
      {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "neon-control-plane.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /app/neon-control-plane
            - --config
            - /etc/neon/config.json
          env:
            - name: JWT_PRIVATE_KEY_PATH
              value: /etc/neon/jwt/privateKey.pem
            - name: JWT_PUBLIC_KEY_PATH
              value: /etc/neon/jwt/publicKey.pem
            # 外部 PG 独立库连接串：只注入引用，绝不写入 values / ConfigMap / release。
            # env 注入的 Secret 在运行期不会自动刷新，轮换后需 kubectl rollout restart。
            {{- if eq $backend "postgres" }}
            - name: NEON_CP_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $dbSecret | quote }}
                  key: {{ $dbSecretKey | quote }}
            {{- end }}
            # 供 K8s 动态拉起 compute 时定位命名空间
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          volumeMounts:
            - name: config
              mountPath: /etc/neon/config.json
              subPath: config.json
            {{- if $jwtSecret }}
            - name: jwt
              mountPath: /etc/neon/jwt
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "neon-control-plane.fullname" . }}-config
        {{- if $jwtSecret }}
        - name: jwt
          secret:
            secretName: {{ $jwtSecret }}
            # 投影白名单：控制面只需要公私钥两个键。
            # 各 scope token 不投影进来 —— 控制面持有私钥即可按需签发，
            # 不需要复用预生成的静态 token，也就不必把它们暴露给这个容器。
            items:
              - key: privateKey.pem
                path: privateKey.pem
              - key: publicKey.pem
                path: publicKey.pem
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
