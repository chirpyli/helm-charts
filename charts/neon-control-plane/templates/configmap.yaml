apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "neon-control-plane.fullname" . }}-config
  labels:
    {{- include "neon-control-plane.labels" . | nindent 4 }}
data:
  # 控制面运行配置（Go 服务以 --config 读取此 JSON）
  # 注意：不再包含 pageservers / safekeepers 节点清单与 default_tenant_id：
  # 节点由各组件自注册进 storage controller，控制面运行时只查询（SC 为唯一真相源）。
  config.json: |
    {
      "storage_controller_url": "{{ .Values.settings.storageControllerUrl }}",
      "listen_port": {{ .Values.settings.listenPort }},
      "compute_image": "{{ .Values.settings.computeImage }}",
      "compute_service_type": "{{ .Values.settings.computeServiceType }}",
      "node_port_external_host": "{{ .Values.settings.nodePortExternalHost }}",
      "domain": "{{ .Values.settings.domain }}",
      "compute_ctl_port": {{ .Values.settings.computeCtlPort }},
      "reconcile_interval_seconds": {{ .Values.settings.reconcileIntervalSeconds }},
      "reconfigure_timeout_seconds": {{ .Values.settings.reconfigureTimeoutSeconds }},
      "status_reconcile_interval_seconds": {{ .Values.settings.statusReconcileIntervalSeconds }}
    }
