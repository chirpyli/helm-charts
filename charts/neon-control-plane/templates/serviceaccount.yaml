{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "neon-control-plane.serviceAccountName" . }}
  labels:
    {{- include "neon-control-plane.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
# 控制面动态拉起 compute 需要操作本命名空间内的 pods/deployments/services
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "neon-control-plane.fullname" . }}
  labels:
    {{- include "neon-control-plane.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: [""]
    # configmaps 需要 delete 权限：卸载时的 pre-delete 清理钩子（pre-delete-cleanup-job.yaml）
    # 要删除控制面运行时持久化的状态快照 ConfigMap neon-cp-state
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "neon-control-plane.fullname" . }}
  labels:
    {{- include "neon-control-plane.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "neon-control-plane.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "neon-control-plane.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
