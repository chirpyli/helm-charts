{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "neon-control-plane.serviceAccountName" . }}
  labels:
    {{- include "neon-control-plane.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
# 控制面动态拉起 compute 需要操作 deployments/services/pods；
# 端点凭据写入 K8s Secret，需要 secrets 的最小权限。
# 状态持久化已改为外部 PostgreSQL，不再需要任何 configmaps 权限。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "neon-control-plane.fullname" . }}
  labels:
    {{- include "neon-control-plane.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: [""]
    # 端点 SCRAM 验证器 Secret：按 endpoint 动态创建/读取/删除
    resources: ["secrets"]
    verbs: ["get", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "neon-control-plane.fullname" . }}
  labels:
    {{- include "neon-control-plane.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "neon-control-plane.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "neon-control-plane.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
