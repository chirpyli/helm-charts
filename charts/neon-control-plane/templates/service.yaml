apiVersion: v1
kind: Service
metadata:
  name: {{ include "neon-control-plane.serviceName" . }}
  labels:
    {{- include "neon-control-plane.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      name: http
      protocol: TCP
  selector:
    {{- include "neon-control-plane.selectorLabels" . | nindent 4 }}
