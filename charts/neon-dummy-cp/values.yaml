# neon-dummy-cp 默认配置值。
# 这是一个 YAML 格式的文件。
# 在此声明要传递给模板的变量。

image:
  # -- Python 镜像仓库
  repository: python
  # -- 镜像拉取策略
  pullPolicy: IfNotPresent
  # -- 覆盖镜像标签，默认为 Chart 的 appVersion
  tag: "3.11-slim"

# -- 指定 docker-registry 的 Secret 名称数组
imagePullSecrets: []

# -- 部分覆盖 neon-dummy-cp.fullname 模板的字符串（保留发布名称）
nameOverride: ""
# -- 完全覆盖 neon-dummy-cp.fullname 模板的字符器
fullnameOverride: ""

serviceAccount:
  # serviceAccount.create - 指定是否创建 ServiceAccount
  create: true
  # serviceAccount.annotations -- 添加到 ServiceAccount 的注解
  annotations: {}
  # serviceAccount.name - 要使用的 ServiceAccount 名称。
  # 如果未设置且 create 为 true，则使用 fullname 模板生成名称
  name: ""

# -- neon-dummy-cp Pod 的注解
podAnnotations: {}

# -- neon-dummy-cp Pod 的附加标签
podLabels: {}

# -- neon-dummy-cp Pod 安全上下文
podSecurityContext: {}
  # fsGroup: 2000

# -- neon-dummy-cp 容器安全上下文
securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  # service.annotations -- 添加到 Service 的注解
  annotations: {}
  type: ClusterIP
  # service.port -- dummy-cp 监听端口
  port: 8080

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

# -- Pod 节点选择器标签
nodeSelector: {}

# -- Pod 容忍调度配置
tolerations: []

# -- Pod 亲和性调度配置
affinity: {}

# -- Pod 优先级类
priorityClassName: ""

# -- 随 Chart 一同创建的额外 Kubernetes 资源清单
extraManifests: []
