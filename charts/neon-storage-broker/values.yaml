# neon-storage-broker 默认配置值。
# 这是一个 YAML 格式的文件。
# 在此声明要传递给模板的变量。

image:
  # -- Neondatabase 镜像仓库
  repository: neondatabase/neon
  # -- 镜像拉取策略
  pullPolicy: Always
  # -- 覆盖镜像标签，默认为 Chart 的 appVersion
  tag: "latest"

# -- 指定 docker-registry 的 Secret 名称数组
imagePullSecrets: []

# -- 部分覆盖 neon-storage-broker.fullname 模板的字符串（保留发布名称）
nameOverride: ""
# -- 完全覆盖 neon-storage-broker.fullname 模板的字符器
fullnameOverride: ""

# Neon broker 配置
settings:
  # settings.sentryUrl -- URL（将转换为 `SENTRY_DSN` 环境变量），Sentry 用于收集 storage-broker 中的错误/panic 事件
  sentryUrl: ""
  # settings.sentryEnvironment -- "development" 或 "production"，在 Sentry 中用于过滤问题
  sentryEnvironment: "development"

serviceAccount:
  # serviceAccount.create - 指定是否创建 ServiceAccount
  create: true
  # serviceAccount.annotations -- 添加到 ServiceAccount 的注解
  annotations: {}
  # serviceAccount.name - 要使用的 ServiceAccount 名称。
  # 如果未设置且 create 为 true，则使用 fullname 模板生成名称
  name: ""

# -- neon-storage-broker Pod 的注解
podAnnotations: {}

# -- neon-storage-broker Pod 的附加标签
podLabels: {}
  # neon_service: broker
  # neon_env: staging
  # neon_region: us-west-1
  # neon_region_slug: virginia

# -- neon-storage-broker Pod 安全上下文
podSecurityContext: {}
  # fsGroup: 2000

# -- neon-storage-broker 容器安全上下文
securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  # service.annotations -- 添加到 Service 的注解
  annotations: {}
  type: ClusterIP
  # service.port -- broker 监听端口
  port: 50051

resources:
  limits:
    memory: 8Gi
  requests:
    cpu: "1"
    memory: 2Gi

# -- Pod 节点选择器标签
nodeSelector: {}

# -- Pod 容忍调度配置
tolerations: []

# -- Pod 亲和性调度配置
affinity: {}

# -- Pod 优先级类
priorityClassName: ""

metrics:
  # metrics.enabled -- 启用 Prometheus 指标自动发现
  enabled: false
  ## Prometheus Operator ServiceMonitor 配置
  ##
  serviceMonitor:
    # metrics.serviceMonitor.enabled -- 创建 ServiceMonitor 资源
    enabled: false

    # metrics.serviceMonitor.namespace -- 创建 ServiceMonitor 的命名空间，为空则使用 Release.Namespace
    namespace: ""

    ## 指标抓取间隔。
    ## 参考: https://github.com/coreos/prometheus-operator/blob/master/Documentation/api.md#endpoint
    ##
    # metrics.serviceMonitor.interval -- Prometheus 抓取间隔
    interval: 10s

    ## 抓取超时时间
    ## 参考: https://github.com/coreos/prometheus-operator/blob/master/Documentation/api.md#endpoint
    ##
    # metrics.serviceMonitor.scrapeTimeout -- Prometheus 抓取超时时间
    scrapeTimeout: 10s

    ## ServiceMonitor 选择器标签
    ## 参考: https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack#prometheusioscrape
    ##
    # metrics.serviceMonitor.selector -- 附加标签（供 Prometheus operator 使用）
    selector: {}
    # selector:
    #   prometheus: neon


ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local
  #
# -- 随 Chart 一同创建的额外 Kubernetes 资源清单
extraManifests: []
