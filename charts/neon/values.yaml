# ============================================================
# Neon umbrella 总 values
# 部署前提（需用户自备，未提供则组件启动后功能受限）：
#   1) 外部 PostgreSQL（storage-controller 元数据后端）→ 下方 neon-storage-controller.settings.databaseUrl
#   2) 外部 MinIO / S3 凭证 → 命名空间内名为 bucket-credentials 的 Secret（见 docs/plan.md 顶部示例）
#   3) Ed25519 密钥对：公钥(publicKey)交给 pageserver/safekeeper 校验，私钥(privateKey)交给 control-plane 签发 token
#   4) 各 scope 的 JWT（均置于 global.jwt 下）：pageserverJwtToken / safekeeperJwtToken /
#      controlPlaneJwtToken / peerJwtToken / computeJwtToken / generationsApiJwtToken。
#      storage-controller 的 settings 同名项留空即可自动从 global.jwt 继承，无需重复填写。
#   5) 每个会运行 pageserver / safekeeper 的 k8s 节点必须带可用区标签：
#      kubectl label node <node> topology.kubernetes.io/zone=<az> --overwrite
#      可用区不再由 values 静态指定，Pod 启动时会动态读取所在节点的该标签；缺失则 Pod 停在 Init 状态。
# 生成示例（自签，仅演示）：
#   openssl genpkey -algorithm ed25519 -out privateKey.pem
#   openssl pkey -in privateKey.pem -pubout -out publicKey.pem
#   # JWT 内容可由 control plane 自行签发，这里填任意非空串占位（SC 仅校验签名，不校验签发者）
# 建议通过 --set 或独立 values 文件注入，勿将密钥提交到仓库。
# ============================================================

# 共享 JWT 密钥 Secret 名称（umbrella 创建，供 pageserver/safekeeper/control-plane 挂载）
jwtSecretName: "neon-jwt"

# -- 全局配置（自动注入到各子 chart 的 .Values.global）
global:
  region: "local"
  jwt:
    # 已有 Secret 名称；若设置则不新建（与 jwtSecretName 取值应一致）
    existingSecret: ""
    # 共享 Secret 名称（与顶层 jwtSecretName 一致）
    secretName: "neon-jwt"
    # -- Ed25519 公钥（PEM，含 -----BEGIN PUBLIC KEY-----）
    publicKey: ""
    # -- Ed25519 私钥（PEM，含 -----BEGIN PRIVATE KEY-----）
    privateKey: ""
    # -- 各 scope JWT（SC 校验签名用）
    pageserverJwtToken: ""
    safekeeperJwtToken: ""
    controlPlaneJwtToken: ""
    peerJwtToken: ""
    computeJwtToken: ""
    # -- pageserver → SC 的 upcall(re-attach/validate) 需要 generations_api scope
    generationsApiJwtToken: ""

# ---------------- 子 chart 透传 ----------------

neon-storage-broker:
  enabled: true
  nameOverride: "broker-svc"
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

neon-storage-controller:
  enabled: true
  nameOverride: "storage-controller"
  resources:
    limits:
      cpu: "1"
      memory: 512Mi
    requests:
      cpu: "1"
      memory: 512Mi
  settings:
    # 外部 PostgreSQL 连接串（必填）：环境相关，不进 global，必须在此填写
    databaseUrl: ""
    # 严格模式下必填：指向 control plane 的 notify 端点基址（SC 启动即校验）
    controlPlaneUrl: "http://neon-control-plane-svc:8080"

neon-pageserver:
  enabled: true
  nameOverride: "pageserver"
  statefulSet:
    replicas: 2
    resources:
      limits:
        cpu: "500m"
        memory: 512Mi
      requests:
        cpu: "500m"
        memory: 512Mi
    storage:
      size: 5Gi
  settings:
    brokerEndpoint: "http://neon-broker-svc:50051"
    storageControllerUrl: "http://neon-storage-controller-svc:50051"
    # control_plane_api_token（PS→SC upcall）需 generations_api scope，
    # 由 global.jwt.generationsApiJwtToken 提供（无需在此重复填）
    # 注意：可用区（AZ）不再静态指定。pageserver 启动时由 init 容器读取所在节点的
    # topology.kubernetes.io/zone 标签动态获取，并写入 pageserver.toml 与 metadata.json。
    # 节点未打该标签时 Pod 会停在 Init 状态并报错退出（需先 kubectl label node <node> topology.kubernetes.io/zone=<az>）。
    remoteStorage:
      bucketName: "neondata"
      bucketRegion: "us-east-1"
      endpoint: "http://192.168.232.128:9000"
      prefixInBucket: "pageserver"

neon-safekeeper:
  enabled: true
  nameOverride: "safekeeper"
  statefulSet:
    replicas: 3
    resources:
      limits:
        cpu: "200m"
        memory: 256Mi
      requests:
        cpu: "200m"
        memory: 256Mi
    storage:
      size: 2Gi
  settings:
    brokerEndpoint: "http://neon-broker-svc:50051"
    # 以下两项供 safekeeper 注册 sidecar 使用：
    # storageControllerUrl/adminToken 均从 global.jwt 中自动继承
    # 若需覆盖可在此显式填写
    storageControllerUrl: "http://neon-storage-controller-svc:50051"
    adminToken: ""
    # 注意：可用区（AZ）不再静态指定。safekeeper 启动时由 init 容器读取所在节点的
    # topology.kubernetes.io/zone 标签动态获取，主容器 --availability-zone 与注册 sidecar
    # 上报的 availability_zone_id 均使用该值。
    # 节点未打该标签时 Pod 会停在 Init 状态并报错退出。

neon-control-plane:
  enabled: true
  nameOverride: "control-plane"
  image:
    repository: 192.168.232.128:5000/neon/neon-control-plane
    tag: "latest"
    pullPolicy: Always
  resources:
    limits:
      cpu: "100m"
      memory: 128Mi
    requests:
      cpu: "100m"
      memory: 128Mi
  settings:
    storageControllerUrl: "http://neon-storage-controller-svc:50051"
    listenPort: 8080
    # 注意：pageserver / safekeeper 的节点清单不再由 Helm 静态声明。
    # pageserver 启动时通过 re-attach(metadata.json) 自注册，safekeeper 由 sk-register sidecar 注册并激活，
    # 控制面运行时只从 storage controller 查询（GET /control/v1/node、/control/v1/safekeeper）。
    # compute_ctl 二进制只存在于 compute-node 专用镜像中，不能用 neondatabase/neon 通用镜像。
    computeImage: "neondatabase/compute-node-v17:latest"
    domain: "neon.local"
    nodePortExternalHost: "192.168.232.128"
    computeServiceType: "NodePort"

# ---------------- 本地盘 StorageClass（可选） ----------------
# 默认关闭：若集群已有 local-path（k3s/kind 内置）或自有 StorageClass，无需启用本子 chart。
# 启用示例（同时让 pageserver/safekeeper 显式引用该 StorageClass）：
#   helm upgrade neon ./charts/neon \
#     --set local-path-provisioner.enabled=true \
#     --set neon-pageserver.statefulSet.storage.storageClassName=local-path \
#     --set neon-safekeeper.statefulSet.storage.storageClassName=local-path
# 注意：该子 chart 由 neon 统一调度命名空间，不要开启 namespace.create。
local-path-provisioner:
  # -- 是否部署 local-path-provisioner（默认关闭，不侵入现有部署）
  enabled: true
  storageClass:
    # -- 供给出的 StorageClass 名称（默认不设为集群默认，由组件显式引用）
    name: "local-path"
  image:
    # -- provisioner 镜像（私有 registry 场景需覆盖）
    repository: rancher/local-path-provisioner
    tag: "v0.0.36"
