
# -- 全局配置（自动注入到各子 chart 的 .Values.global）
global:
  region: "local"
  jwt:
    # -- 外部预建的共享 JWT Secret 名称
    # 请先用仓库根目录的 jwt.py 生成并 apply：
    #   python3 jwt.py --namespace <ns> --secret-name neon-jwt
    #   kubectl apply -f jwt-out/neon-jwt.secret.yaml
    # 需要密钥入库时，请把输出的 Secret YAML 交给 SOPS / Sealed Secrets / External Secrets 加密。
    existingSecret: "neon-jwt"
  # -- storage-controller 元数据后端（外部 PostgreSQL）的连接串 Secret。
  # 与 global.jwt.existingSecret 同一套约定：chart 只"引用"、绝不持有明文，
  # 连接串本身不进 values、不进 Helm release、不进渲染后的 manifest。
  storageController:
    databaseUrl:
      # -- Secret 名称，示例见 docs/neon.yaml 的 storage-controller-pg-cluster
      existingSecret: "storage-controller-pg-cluster"
      # -- Secret 中存放连接串的键名（CloudNativePG / docs 示例均用 uri）
      secretKey: "uri"
  # -- 外部对象存储（MinIO / S3）：连接坐标与凭证的唯一事实来源。
  # 与 global.jwt.existingSecret / global.storageController.databaseUrl 同一套约定：
  # chart 只"引用"、绝不持有明文，坐标不进 values、不进 ConfigMap、不进 Helm release。
  storage:
    bucket:
      # -- Secret 名称，示例见 docs/neon.yaml 的 bucket-credentials
      existingSecret: "bucket-credentials"
      # -- 键名映射（留空表示全部使用子 chart 的默认键名：
      # BUCKET_NAME / AWS_REGION / AWS_ENDPOINT_URL / AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY）
      keys: {}

# ---------------- 子 chart 透传 ----------------

neon-storage-broker:
  enabled: true
  nameOverride: "broker-svc"
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

neon-storage-controller:
  enabled: true
  nameOverride: "storage-controller"
  resources:
    limits:
      cpu: "1"
      memory: 512Mi
    requests:
      cpu: "1"
      memory: 512Mi
  settings:
    controlPlaneUrl: "http://neon-control-plane-svc:8080"

neon-pageserver:
  enabled: true
  nameOverride: "pageserver"
  statefulSet:
    replicas: 2
    resources:
      limits:
        cpu: "500m"
        memory: 512Mi
      requests:
        cpu: "500m"
        memory: 512Mi
    storage:
      size: 5Gi
  settings:
    brokerEndpoint: "http://neon-broker-svc:50051"
    storageControllerUrl: "http://neon-storage-controller-svc:50051"
    remoteStorage:
      prefixInBucket: "pageserver"

neon-safekeeper:
  enabled: true
  nameOverride: "safekeeper"
  statefulSet:
    replicas: 3
    resources:
      limits:
        cpu: "200m"
        memory: 256Mi
      requests:
        cpu: "200m"
        memory: 256Mi
    storage:
      size: 2Gi
  settings:
    brokerEndpoint: "http://neon-broker-svc:50051"
    # storageControllerUrl 供 safekeeper 注册 sidecar 使用。
    storageControllerUrl: "http://neon-storage-controller-svc:50051"


neon-control-plane:
  enabled: true
  nameOverride: "control-plane"
  image:
    repository: 192.168.232.128:5000/neondatabase/neon-control-plane
    tag: "latest"
    pullPolicy: Always
  resources:
    limits:
      cpu: "100m"
      memory: 128Mi
    requests:
      cpu: "100m"
      memory: 128Mi
  settings:
    storageControllerUrl: "http://neon-storage-controller-svc:50051"
    listenPort: 8080
    # 注意：pageserver / safekeeper 的节点清单不再由 Helm 静态声明。
    # pageserver 启动时通过 re-attach(metadata.json) 自注册，safekeeper 由 sk-register sidecar 注册并激活，
    # 控制面运行时只从 storage controller 查询（GET /control/v1/node、/control/v1/safekeeper）。
    # compute_ctl 二进制只存在于 compute-node 专用镜像中，不能用 neondatabase/neon 通用镜像。
    computeImage: "neondatabase/compute-node-v17:latest"
    domain: "neon.local"
    nodePortExternalHost: "192.168.232.128"
    computeServiceType: "NodePort"
    # compute_ctl 外部 HTTP 端口 / SC 对账周期 / 单次 /configure 推送超时。
    # 与控制面推送重配置（pageserver 故障转移后热更新 compute 路由）相关。
    computeCtlPort: 3080
    reconcileIntervalSeconds: 30
    reconfigureTimeoutSeconds: 120
    statusReconcileIntervalSeconds: 15


local-path-provisioner:
  enabled: true
  storageClass:
    name: "local-path"
  image:
    repository: rancher/local-path-provisioner
    tag: "v0.0.36"
  config:
    helperImage:
      repository: 192.168.232.128:5000/neondatabase/busybox
      tag: "1.35.0"
