{{- if not .Values.global.jwt.existingSecret }}
# 共享 JWT 密钥 Secret：pageserver/safekeeper 用 publicKey.pem 校验，control-plane 用 privateKey.pem 签发。
# 若已通过 global.jwt.existingSecret 指定既有 Secret，则跳过创建。
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.jwtSecretName | default "neon-jwt" }}
  labels:
    app.kubernetes.io/part-of: neon
type: Opaque
data:
  publicKey.pem: {{ .Values.global.jwt.publicKey | b64enc | quote }}
  privateKey.pem: {{ .Values.global.jwt.privateKey | b64enc | quote }}
  pageserverJwtToken: {{ .Values.global.jwt.pageserverJwtToken | b64enc | quote }}
  safekeeperJwtToken: {{ .Values.global.jwt.safekeeperJwtToken | b64enc | quote }}
  controlPlaneJwtToken: {{ .Values.global.jwt.controlPlaneJwtToken | b64enc | quote }}
  peerJwtToken: {{ .Values.global.jwt.peerJwtToken | b64enc | quote }}
  computeJwtToken: {{ .Values.global.jwt.computeJwtToken | b64enc | quote }}
  # pageserver → SC 的 upcall(re-attach/validate/import-status) 需要 generations_api scope
  generationsApiJwtToken: {{ .Values.global.jwt.generationsApiJwtToken | b64enc | quote }}
{{- end }}
