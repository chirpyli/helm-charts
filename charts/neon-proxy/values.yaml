# neon-proxy 默认配置。
# 本文件为 YAML 格式。
# 在此声明要传入模板的变量。

replicaCount: 1

# -- 部署分区。为空时 1 个 Deployment 覆盖所有分区；非空时每个分区有 1 个独立 Deployment
zones: {}

# -- Deployment 的更新策略覆盖
deploymentStrategy:
  type: Recreate

# -- Deployment 的优雅终止宽限期（秒）
terminationGracePeriodSeconds: 30

image:
  # -- Neondatabase 镜像仓库地址
  repository: neondatabase/neon
  # -- 镜像拉取策略
  pullPolicy: Always
  # -- 覆盖镜像 tag，默认为 chart 的 appVersion
  tag: "latest"

# -- 以数组形式指定 docker-registry 的 secret 名称
imagePullSecrets: []

# -- (string) neon-proxy 用于验证计算节点 TLS 证书的根证书
internalCa: null

# -- 部分覆盖 neon-proxy.fullname 模板名称（保留 release 名称）
nameOverride: ""
# -- 完全覆盖 neon-proxy.fullname 模板名称
fullnameOverride: ""

# Neon proxy 配置
settings:
  # settings.useCertManager 为 true 时，将使用 cert-manager 为客户端 PostgreSQL 连接生成 TLS 证书
  useCertManager: true
  # settings.authEndpoint -- 认证端点，例如 "http://console.neon/authenticate_proxy_request/"
  authEndpoint: ""
  # settings.uri -- psql 会话端点，例如 "http://console.neon/psql_session/"
  uri: ""
  # settings.authBackend -- 认证方式（console|link|postgres）
  authBackend: "link"
  # settings.domain -- 客户端 PostgreSQL 连接的 TLS 证书中使用的域名
  domain: ""
  # settings.extraDomains -- 客户端 PostgreSQL 连接额外 TLS 证书中使用的域名
  extraDomains: []
  # settings.rustLog -- Proxy 日志级别
  rustLog: "INFO"
  # settings.logfmt -- 日志格式："text"（默认）或 "json"
  logfmt: null
  # settings.otelExporterOtlpEndpoint -- OpenTelemetry Collector URL（转换为 `OTEL_EXPORTER_OTLP_ENDPOINT` 环境变量）
  otelExporterOtlpEndpoint: ""
  # settings.otelExporterDisabled -- 禁用 OpenTelemetry（转换为 `OTEL_SDK_DISABLED` 环境变量）
  # 默认禁用，自建 K8s 环境通常没有 OTLP Collector，避免 BatchSpanProcessor.ExportError 报错
  otelExporterDisabled: true
  # settings.sentryUrl -- Sentry 用于收集 neon-proxy 错误/panic 事件的 URL（转换为 `SENTRY_DSN` 环境变量）
  sentryUrl: ""
  # settings.sentryEnvironment -- "development" 或 "production"，在 Sentry 中可见用于筛选问题
  sentryEnvironment: "development"
  # settings.wssPort -- (int) WSS/HTTPS 端口。为 null 时不启动 WSS 服务
  wssPort: null
  # settings.metricCollectionEndpoint -- (url) 指标上报端点。为 null 时不发送指标
  metricCollectionEndpoint: ""
  # settings.metricCollectionInterval -- (string) 指标发送频率
  metricCollectionInterval: ""
  # settings.controlplane_token -- (string) 传递给 Control Plane 管理 API 的 JWT token
  controlplane_token: ""
  # settings.wakeComputeLock -- (string) 按 endpoint 配置 wake_compute 的锁定策略
  wakeComputeLock: "permits=0"
  # settings.connectComputeLock -- (string) 按 compute 配置 connect_compute 的锁定策略
  connectComputeLock: ""
  # settings.redisNotifications -- (url) Redis 客户端配置 URL
  redisNotifications: ""
  # settings.redisAuthType -- (string) 区域 Redis 客户端的认证方式。支持 "irsa" 和 "plain"。"plain" 使用 settings.redisNotifications 中的 URI；"irsa" 使用 AWS IRSA
  redisAuthType: "irsa"
  # settings.sqlOverHttpMaxRequestSizeBytes -- (string) SQL over HTTP 请求体的最大大小（字节）
  sqlOverHttpMaxRequestSizeBytes: "10485760"
  # settings.sqlOverHttpMaxResponseSizeBytes -- (string) SQL over HTTP 响应体的最大大小（字节）
  sqlOverHttpMaxResponseSizeBytes: "10485760"
  # settings.sqlOverHttpTimeout -- (string) HTTP 连接请求的超时时间
  sqlOverHttpTimeout: "15s"
  # settings.httpPoolOptIn -- (bool) 为 true 时 SQL over HTTP 连接池为 opt-in 模式；false 时始终启用
  httpPoolOptIn: true
  # settings.endpointRpsLimits -- (list) 不同时间间隔下的连接尝试速率限制器列表
  endpointRpsLimits: []
  # settings.wakeComputeLimits -- (list) 不同时间间隔下 wake_compute 的速率限制器列表
  wakeComputeLimits: []
  # settings.authRateLimitsEnabled -- (bool) 是否启用认证速率限制
  authRateLimitsEnabled: null
  # settings.authRateLimits -- (list) 按 IP+EP 认证哈希迭代的不同时间间隔速率限制器列表
  authRateLimits: null
  # settings.parquetUploadRemoteStorage -- (string) Parquet 文件的上传目标存储位置
  parquetUploadRemoteStorage: ""
  # settings.parquetUploadDisconnectEventsRemoteStorage -- (string) 包含断连事件的 Parquet 文件上传目标存储位置
  parquetUploadDisconnectEventsRemoteStorage: ""
  # settings.parquetUploadRowGroupSize -- (string) 每个 row group 包含的行数
  parquetUploadRowGroupSize: "8192"
  # settings.parquetUploadPageSize -- (string) 每个列页的大小（字节）
  parquetUploadPageSize: "1048576"
  # settings.parquetUploadSize -- (string) Parquet 文件总大小的上限（字节）
  parquetUploadSize: "100000000"
  # settings.parquetUploadMaximumDuration -- (string) 强制上传文件前的最大等待时间
  parquetUploadMaximumDuration: "20m"
  # settings.parquetUploadCompression -- (string) Parquet 文件压缩级别
  parquetUploadCompression: uncompressed
  # settings.region -- (string) 此 proxy 服务部署的区域
  region: ""
  # settings.awsAccessKeyId -- (string) AWS Access Key ID
  awsAccessKeyId: ""
  # settings.awsSecretAccessKey -- (string) AWS Secret Access Key
  awsSecretAccessKey: ""
  # settings.metricBackupCollectionRemoteStorage -- (string) 指标备份文件的上传目标存储位置
  metricBackupCollectionRemoteStorage: ""
  # settings.metricBackupCollectionInterval -- (string) 指标备份文件的上传频率
  metricBackupCollectionInterval: "10m"
  # settings.metricBackupCollectionChunkSize -- (string) 指标备份文件中每个 chunk 的大小（字节）
  metricBackupCollectionChunkSize: "4194304"
  # settings.endpointCacheConfig -- (string) 所有有效 endpoint 的缓存配置
  endpointCacheConfig: ""
  # settings.redisHost -- (string) 流式连接的 Redis 主机（可能与通知主机不同）
  redisHost: ""
  # settings.redisPort -- (string) 流式连接的 Redis 端口
  redisPort: ""
  # settings.redisClusterName -- (string) Redis 集群名称，用于 AWS Elasticache
  redisClusterName: "regional-control-plane-redis"
  # settings.redisUserId -- (string) Redis user_id，用于 AWS Elasticache
  redisUserId: "neon"
  # settings.awsRegion -- (string) 获取凭证的 AWS 区域
  awsRegion: ""
  # settings.proxyProtocolV2 -- (string) 是否启用 PROXY protocol V2 解析。可选值："rejected"、"supported"、"required"
  proxyProtocolV2: ""
  # settings.extraCmdFlags -- (list) proxy 二进制的额外命令行参数
  extraCmdFlags: []
  # settings.extraEnvVars -- (list) proxy 二进制的额外环境变量
  extraEnvVars: []
  # settings.consoleJwtPublicKey -- (string) Console JWT 验证的公钥
  consoleJwtPublicKey: ""
  # settings.neonMotd -- (boolean) 是否需要显示包含 session_id 的欢迎信息
  enable_neonMotd: false

pgSniRouter:
  # pgSniRouter.destination -- 将此域名后缀追加到转换后的 SNI 主机名以获取目标地址，例如 "svc.cluster.local"
  destination: "svc.cluster.local"
  # pgSniRouter.domain -- 客户端 PostgreSQL 连接的 TLS 证书中使用的域名
  domain: ""

  exposedService:
    # pgSniRouter.exposedService.name -- 此 Service 的名称
    name: ""
    # pgSniRouter.exposedService.annotations -- 外部暴露 Service 的注解
    annotations: {}
      # service.beta.kubernetes.io/aws-load-balancer-type: external
      # service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
      # service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
      # external-dns.alpha.kubernetes.io/hostname: chart-example.local
    # pgSniRouter.exposedService.type -- 外部暴露的 Service 类型
    type: LoadBalancer
    # pgSniRouter.exposedService.port -- 外部暴露的代理端口
    port: 5432
    # pgSniRouter.exposedService.portTls -- 使用 TLS 连接计算节点的外部暴露代理端口
    portTls: 5433

serviceAccount:
  # serviceAccount.create -- 是否创建 ServiceAccount
  create: true
  # serviceAccount.annotations -- ServiceAccount 的注解
  annotations: {}
  # serviceAccount.name -- 要使用的 ServiceAccount 名称
  # 如果未设置且 create 为 true，将通过 fullname 模板生成名称
  name: ""

# -- neon-proxy Pod 的注解
podAnnotations: {}

# -- neon-proxy Pod 的附加标签
podLabels: {}
  # neon_service: proxy
  # neon_env: staging
  # neon_region: us-west-1
  # neon_region_slug: virginia

# -- neon-proxy Pod 的安全上下文
podSecurityContext: {}
  # fsGroup: 2000

# -- neon-proxy 容器的生命周期钩子配置
containerLifecycle: {}

# -- neon-proxy 容器的安全上下文
securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  # service.annotations -- Service 的注解
  annotations: {}
  # service.type -- Service 类型
  type: ClusterIP
  # service.port -- Service 管理端口
  port: 7000
  # service.httpPort -- HTTP 管理端口
  httpPort: 9090

exposedService:
  # exposedService.name -- 此 Service 的名称
  name: ""
  # exposedService.annotations -- 外部暴露 Service 的注解
  annotations: {}
    # service.beta.kubernetes.io/aws-load-balancer-type: external
    # service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    # service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    # external-dns.alpha.kubernetes.io/hostname: chart-example.local
  # exposedService.type -- 外部暴露的 Service 类型
  type: LoadBalancer
  # exposedService.externalTrafficPolicy -- 外部流量策略（Cluster, Internal）
  externalTrafficPolicy: Cluster
  # exposedService.port -- 外部暴露的代理端口
  # 为 null 时不暴露代理端口，适用于 auth-broker 场景
  port: 5432
  # exposedService.httpsPort -- (int) 外部暴露的 HTTPS 端口。为 null 时不暴露 HTTPS 服务
  httpsPort: null

resources:
  limits:
    memory: 32Gi
  requests:
    cpu: 400m
    memory: 2Gi

# -- Pod 调度的节点标签选择器
nodeSelector: {}

# -- Pod 调度的容忍策略
tolerations: []

# -- Pod 调度的亲和性策略
affinity: {}

# -- Pod 调度的拓扑分布约束
topologySpreadConstraints: {}

metrics:
  # metrics.enabled -- 启用 Prometheus 指标自动发现
  enabled: false
  ## Prometheus Operator ServiceMonitor 配置
  ##
  serviceMonitor:
    # metrics.serviceMonitor.enabled -- 创建 ServiceMonitor 资源
    enabled: false

    # metrics.serviceMonitor.namespace -- 创建 ServiceMonitor 的命名空间，为空则使用 Release.Namespace
    namespace: ""

    ## Prometheus 抓取指标的时间间隔
    ## 参考: https://github.com/coreos/prometheus-operator/blob/master/Documentation/api.md#endpoint
    ##
    # metrics.serviceMonitor.interval -- Prometheus 抓取指标的时间间隔
    interval: 10s

    ## 抓取超时时间
    ## 参考: https://github.com/coreos/prometheus-operator/blob/master/Documentation/api.md#endpoint
    ##
    # metrics.serviceMonitor.scrapeTimeout -- Prometheus 抓取超时时间
    scrapeTimeout: 10s

    ## ServiceMonitor 选择器标签
    ## 参考: https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack#prometheusioscrape
    ##
    # metrics.serviceMonitor.selector -- 附加标签（供 Prometheus operator 使用）
    selector: {}
    # selector:
    #   prometheus: neon
# -- 随 chart 创建的额外 K8s 清单
extraManifests: []
