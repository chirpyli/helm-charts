{{- if .Values.storageClass.create }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.storageClass.name }}
  labels:
    {{- include "local-path-provisioner.labels" . | nindent 4 }}
  {{- if or .Values.storageClass.isDefaultClass .Values.storageClass.annotations }}
  annotations:
    {{- if .Values.storageClass.isDefaultClass }}
    # 设为集群默认 StorageClass
    storageclass.kubernetes.io/is-default-class: "true"
    {{- end }}
    {{- with .Values.storageClass.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
# 供给者标识，必须与 provisioner 注册的一致
provisioner: {{ .Values.storageClass.provisioner }}
# 本地盘必须使用 WaitForFirstConsumer：等 Pod 调度后再决定卷落在哪个节点
volumeBindingMode: {{ .Values.storageClass.volumeBindingMode }}
reclaimPolicy: {{ .Values.storageClass.reclaimPolicy }}
allowVolumeExpansion: {{ .Values.storageClass.allowVolumeExpansion }}
{{- end }}
