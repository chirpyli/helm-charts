{{- /*
provisioner 的运行配置：
- config.json：节点 → 宿主机路径映射（nodePathMap）
- setup / teardown：建卷/删卷脚本，由 helper Pod 在目标节点执行
- helperPod.yaml：helper Pod 模板（支持 Go template，可引用 config.helperImage）
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  # 名称固定为 local-path-config：local-path-provisioner v0.0.36 二进制会硬编码读取该名称的
  # ConfigMap（无法通过启动参数更改），改掉会导致 provisioner 启动 fatal 崩溃，故此处写死不可配置。
  name: local-path-config
  namespace: {{ include "local-path-provisioner.namespace" . }}
  labels:
    {{- include "local-path-provisioner.labels" . | nindent 4 }}
data:
  config.json: |-
    {
      "nodePathMap": {{ toJson .Values.config.nodePathMap }}
    }
  setup: |-
{{- .Values.config.setup | trim | nindent 4 }}
  teardown: |-
{{- .Values.config.teardown | trim | nindent 4 }}
  helperPod.yaml: |-
{{- tpl .Values.config.helperPod . | trim | nindent 4 }}
