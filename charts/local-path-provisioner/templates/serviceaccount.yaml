{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  # 名称固定为 local-path-provisioner-service-account：provisioner 二进制创建 helper Pod 时会
  # 硬编码使用该名称（见 values.yaml 说明），不可配置，故写死。
  name: local-path-provisioner-service-account
  namespace: {{ include "local-path-provisioner.namespace" . }}
  labels:
    {{- include "local-path-provisioner.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
