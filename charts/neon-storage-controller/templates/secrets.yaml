apiVersion: v1
kind: Secret
metadata:
  name: {{ include "neon-storage-controller.fullname" . }}-env-vars
  labels:
    {{- include "neon-storage-controller.labels" . | nindent 4 }}
type: Opaque
data:
  # 公钥以 PUBLIC_KEY 环境变量注入：Secret 注入环境变量时保留 PEM 真实换行，
  # storage_controller 的 JwtAuth::from_key 即可正确解析（不能用 --public-key 内联，会转义换行）。
  # 取值优先级：settings.publicKey（独立部署时填写）> global.jwt.publicKey（umbrella 统一注入），
  # 使用 dig 安全取值，global 缺失时返回空而非 nil panic，保证子 chart 可独立部署。
  PUBLIC_KEY: {{ .Values.settings.publicKey | default (dig "jwt" "publicKey" "" .Values.global) | b64enc | quote }}
  # databaseUrl 为环境相关必填项（指向外部 PostgreSQL），不进 global，仅从 settings 读取。
  DATABASE_URL: {{ .Values.settings.databaseUrl | b64enc | quote }}
  # 以下 JWT 同样采用 settings 优先、global.jwt 兜底的回退策略（与 pageserver configmap 一致）：
  # 在 umbrella 下只需在 global.jwt 填一次，子 chart 自动继承；独立部署时仍走 settings。
  CONTROL_PLANE_JWT_TOKEN: {{ .Values.settings.controlPlaneJwtToken | default (dig "jwt" "controlPlaneJwtToken" "" .Values.global) | b64enc | quote }}
  PAGESERVER_JWT_TOKEN: {{ .Values.settings.jwtToken | default (dig "jwt" "pageserverJwtToken" "" .Values.global) | b64enc | quote }}
  SAFEKEEPER_JWT_TOKEN: {{ .Values.settings.safekeeperJwtToken | default (dig "jwt" "safekeeperJwtToken" "" .Values.global) | b64enc | quote }}
  PEER_JWT_TOKEN: {{ .Values.settings.peerJwtToken | default (dig "jwt" "peerJwtToken" "" .Values.global) | b64enc | quote }}
