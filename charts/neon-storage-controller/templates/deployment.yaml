{{- /*
外部 PostgreSQL 连接串是 storage_controller 的必填项（见 storage_controller/src/main.rs
的 Secrets::load：缺失即 anyhow::bail!("Database URL is not set")）。
*/}}
{{- $dbSecret := include "neon-storage-controller.databaseUrlSecretName" . }}
{{- if not $dbSecret }}
{{- fail "必须指定外部 PostgreSQL 连接串 Secret：请设置 neon-storage-controller.settings.databaseUrlSecretName，或 umbrella 的 global.storageController.databaseUrl.existingSecret；键名默认 uri（可用 settings.databaseUrlSecretKey 覆盖）。chart 已不再接受明文 settings.databaseUrl，Secret 需预先 kubectl apply（示例见 docs/neon.yaml 的 storage-controller-pg-cluster）。" }}
{{- end }}
{{- $dbSecretKey := include "neon-storage-controller.databaseUrlSecretKey" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "neon-storage-controller.fullname" . }}
  labels:
    {{- include "neon-storage-controller.labels" . | nindent 4 }}
spec:
  strategy:
  {{- if .Values.settings.startAsCandidate }}
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  {{- else }}
    type: Recreate
  {{- end }}
  replicas: 1
  # Which pods the Deployment is managing (duplicates template.metadata.labels).
  selector:
    matchLabels:
      {{- include "neon-storage-controller.selectorLabels" . | nindent 6 }}
  # Pod template.
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Labels set on created pods.
      labels:
        {{- include "neon-storage-controller.selectorLabels" . | nindent 8 }}
      {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "neon-storage-controller.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - storage_controller
            - -l
            {{- /*
            # In the container, use the same port as service.
            */}}
            - 0.0.0.0:{{ .Values.service.port }}
          {{- /*
          # 注意：publicKey 不能以内联命令行参数传入。
          # 若用 toJson 内联多行 PEM，换行会被转义成字面量 "\n"，导致 storage_controller
          # 的 JwtAuth::from_key 解析失败（InvalidKeyFormat）。
          # 正确做法：以 PUBLIC_KEY 环境变量从 Secret 注入 —— K8s 注入环境变量时会保留
          # PEM 的真实换行符，二进制即可正确解析。
          # 因此此处不传 --public-key，改由下方 env 中的 secretKeyRef 提供。
          */}}
          {{- if .Values.settings.controlPlaneUrl }}
            - --control-plane-url
            - {{ .Values.settings.controlPlaneUrl | quote }}
          {{- end }}
          {{- if .Values.settings.lbmManagementUrl }}
            - --lbm-management-url
            - {{ .Values.settings.lbmManagementUrl | quote }}
          {{- end }}
          {{- if .Values.settings.lbmStorageUrl }}
            - --lbm-storage-url
            - {{ .Values.settings.lbmStorageUrl | quote }}
          {{- end }}
          {{- if .Values.settings.antiEntropyJobInterval }}
            - --anti-entropy-job-interval
            - {{ .Values.settings.antiEntropyJobInterval | quote }}
          {{- end }}
          {{- if .Values.settings.antiEntropyJobDelay }}
            - --anti-entropy-job-delay
            - {{ .Values.settings.antiEntropyJobDelay | quote }}
          {{- end }}
          {{- if .Values.settings.antiEntropyJobEnact }}
            - --anti-entropy-job-enact
          {{- end }}
          {{- if .Values.settings.heartbeatInterval }}
            - --heartbeat-interval
            - {{ .Values.settings.heartbeatInterval | quote }}
          {{- end }}
          {{- if .Values.settings.maxOfflineInterval }}
            - --max-offline-interval
            - {{ .Values.settings.maxOfflineInterval | quote }}
          {{- end }}
          {{- if .Values.settings.maxWarmingUpInterval }}
            - --max-warming-up-interval
            - {{ .Values.settings.maxWarmingUpInterval | quote }}
          {{- end }}
          {{- if .Values.settings.initialSplitThreshold }}
            - --initial-split-threshold
            - {{ .Values.settings.initialSplitThreshold | quote }}
          {{- end }}
          {{- if .Values.settings.initialSplitShards }}
            - --initial-split-shards
            - {{ .Values.settings.initialSplitShards | quote }}
          {{- end }}
          {{- if .Values.settings.splitThreshold }}
            - --split-threshold
            - {{ .Values.settings.splitThreshold | quote }}
          {{- end }}
          {{- if .Values.settings.maxSplitShards }}
            - --max-split-shards
            - {{ .Values.settings.maxSplitShards | quote }}
          {{- end }}
          {{- if .Values.settings.consistencyCheckInterval }}
            - --consistency-check-interval
            - {{ .Values.settings.consistencyCheckInterval | quote }}
          {{- end }}
          {{- if .Values.settings.lazyDrainsFills }}
            - --lazy-drains-fills
            - {{ .Values.settings.lazyDrainsFills | quote }}
          {{- end }}
          {{- if .Values.settings.chaosInterval }}
            - --chaos-interval
            - {{ .Values.settings.chaosInterval | quote }}
          {{- end }}
          {{- if .Values.settings.chaosExitCrontab }}
            - --chaos-exit-crontab
            - {{ .Values.settings.chaosExitCrontab | quote }}
          {{- end }}
          {{- if .Values.settings.chaosSafekeeperInterval }}
            - --chaos-safekeeper-interval
            - {{ .Values.settings.chaosSafekeeperInterval | quote }}
          {{- end }}
            - --address-for-peers
            - http://$(POD_IP):{{ .Values.service.port }}/
          {{- if .Values.settings.startAsCandidate }}
            - --start-as-candidate
          {{- end }}
          {{- if .Values.settings.longReconcileThreshold }}
            - --long-reconcile-threshold
            - {{ .Values.settings.longReconcileThreshold | quote }}
          {{- end }}
          {{- if .Values.settings.timelinesOntoSafekeepers }}
            - --timelines-onto-safekeepers
          {{- end }}
          {{- if .Values.settings.checkTimelineDigestAcrossSmallShardSplits }}
            - --check-timeline-digest-across-small-shard-splits
          {{- end }}
          {{- if .Values.settings.enableLocationUpdates }}
            - --enable-location-updates
          {{- end }}
          {{- if .Values.settings.pageserverAutoMigrationEnabled }}
            - --pageserver-auto-migration-enabled
          {{- end }}
          {{- if .Values.settings.pageserverAutoMigrationMaxMigrationsPerDestination }}
            - --pageserver-auto-migration-max-migrations-per-destination
            - {{ .Values.settings.pageserverAutoMigrationMaxMigrationsPerDestination | quote }}
          {{- end }}
          {{- if .Values.settings.pageserverAutoMigrationDiskUtilizationSourceMin }}
            - --pageserver-auto-migration-disk-utilization-source-min
            - {{ .Values.settings.pageserverAutoMigrationDiskUtilizationSourceMin | quote }}
          {{- end }}
          {{- if .Values.settings.pageserverAutoMigrationDiskActualUsageSourceMin }}
            - --pageserver-auto-migration-disk-actual-usage-source-min
            - {{ .Values.settings.pageserverAutoMigrationDiskActualUsageSourceMin | quote }}
          {{- end }}
          {{- if .Values.settings.pageserverAutoMigrationDiskUtilizationSourceTarget }}
            - --pageserver-auto-migration-disk-utilization-source-target
            - {{ .Values.settings.pageserverAutoMigrationDiskUtilizationSourceTarget | quote }}
          {{- end }}
          {{- if .Values.settings.pageserverAutoMigrationDiskUtilizationDestinationMax }}
            - --pageserver-auto-migration-disk-utilization-destination-max
            - {{ .Values.settings.pageserverAutoMigrationDiskUtilizationDestinationMax | quote }}
          {{- end }}
          {{- if .Values.settings.pageserverAutoMigrationMaxShardSizeLimit }}
            - --pageserver-auto-migration-max-shard-size-limit
            - {{ .Values.settings.pageserverAutoMigrationMaxShardSizeLimit | quote }}
          {{- end }}
          {{- if .Values.settings.neonRegion }}
            - --neon-region
            - {{ .Values.settings.neonRegion | quote }}
          {{- end }}
          {{- if .Values.settings.neonCloud }}
            - --neon-cloud
            - {{ .Values.settings.neonCloud | quote }}
          {{- end }}
          env:
            {{- /*
            外部 PostgreSQL 连接串：只注入"引用"，Secret 由集群侧预建并独立轮换。
            env 中的变量优先于 envFrom 的同名变量；本 chart 已不再使用 envFrom 整包注入，
            避免后续往 Secret 加键时静默多注入环境变量。
            注意：env 注入的变量在 Pod 运行期不会随 Secret 更新而变化，
            轮换连接串后需执行 kubectl rollout restart（见 charts/neon/templates/NOTES.txt）。
            这里不使用 optional: true —— Secret 缺失时 Pod 停在 CreateContainerConfigError
            并给出明确原因，符合 fail fast。
            */}}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $dbSecret }}
                  key: {{ $dbSecretKey }}
            - name: RUST_LOG
              value: "INFO"
            - name: RUST_BACKTRACE
              value: "1"
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            {{- /*
            从共享 JWT Secret 直接注入公钥与各 scope token。
            storage_controller 只支持从 CLI 参数或环境变量读取密钥
            （见 storage_controller/src/main.rs 的 Secrets::load_secret），
            环境变量由 K8s 以 secretKeyRef 解析，因此这里只出现"引用"而非明文：
              - Helm release 中不含任何 token；
              - Pod spec 中只出现 Secret 名称与键名。
            未配置共享 Secret 时（子 chart 独立部署场景）整段跳过，退化为无认证启动。
            */}}
            {{- $jwtSecret := include "neon-storage-controller.jwtSecretName" . }}
            {{- if $jwtSecret }}
            # 校验入站请求签名用；多行 PEM 经环境变量注入可保留真实换行
            - name: PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $jwtSecret }}
                  key: publicKey.pem
            - name: PAGESERVER_JWT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $jwtSecret }}
                  key: pageserverJwtToken
            - name: SAFEKEEPER_JWT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $jwtSecret }}
                  key: safekeeperJwtToken
            - name: CONTROL_PLANE_JWT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $jwtSecret }}
                  key: controlPlaneJwtToken
            - name: PEER_JWT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $jwtSecret }}
                  key: peerJwtToken
            {{- end }}
          {{- if .Values.settings }}
            {{- with .Values.settings.sentryUrl }}
            - name: SENTRY_DSN
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.settings.sentryEnvironment }}
            - name: SENTRY_ENVIRONMENT
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.settings.posthogConfig }}
            - name: POSTHOG_CONFIG
              value: {{ . | toJson | quote }}
            {{- end }}
          {{- end }}
          ports:
            - name: controller
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /status
              port: controller
            initialDelaySeconds: 10
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /live
              port: controller
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: controller
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 24
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
