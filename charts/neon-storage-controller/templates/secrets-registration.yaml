{{/*
注册 Job（registerControlPlane）的 JWT 前置校验。

该 Job 需要调用 control plane 的注册接口，因此必须有 controlplane scope 的 token。
改造前它由 registerControlPlane.controlPlaneJwtToken 明文传入并落到自建 Secret 里，
与"chart 不承载任何 JWT 明文"的目标冲突，现改为从共享 JWT Secret 的 controlPlaneJwtToken 键引用。

只有当 registerControlPlane.enable=true 时才校验：
该功能默认关闭，不开就不应因为没配共享 Secret 而阻塞渲染。
*/}}
{{- if .Values.registerControlPlane.enable }}
{{- if not (dig "jwt" "existingSecret" "" (.Values.global | default dict)) }}
{{- fail "registerControlPlane.enable=true 需要共享 JWT Secret：请设置 global.jwt.existingSecret（先用仓库根目录的 jwt.py 生成并 kubectl apply），Job 会从中读取 controlPlaneJwtToken。已移除 registerControlPlane.controlPlaneJwtToken 明文入口。" }}
{{- end }}
{{- end }}
