# neon-storage-controller 默认配置值。
# 这是一个 YAML 格式的文件。
# 在此声明要传递给模板的变量。

image:
  # -- Neondatabase 镜像仓库
  repository: neondatabase/neon
  # -- 镜像拉取策略
  pullPolicy: Always
  # -- 覆盖镜像标签，默认为 Chart 的 appVersion
  tag: "latest"

# -- 指定 docker-registry 的 Secret 名称数组
imagePullSecrets: []

# -- 部分覆盖 neon-storage-controller.fullname 模板的字符串（保留发布名称）
nameOverride: ""
# -- 完全覆盖 neon-storage-controller.fullname 模板的字符串
fullnameOverride: ""

# Neon controller 配置
settings:
  # settings.sentryUrl -- URL（将转换为 `SENTRY_DSN` 环境变量），Sentry 用于收集 storage-controller 中的错误/panic 事件
  sentryUrl: ""
  # settings.sentryEnvironment -- "development" 或 "production"，在 Sentry 中用于过滤问题
  sentryEnvironment: "development"
  # settings.devMode -- 启用开发模式，跳过某些生产环境的校验
  devMode: true
  # settings.timelineSafekeeperCount -- 每个 timeline 的 safekeeper 副本数
  timelineSafekeeperCount: 1
  # settings.databaseUrl -- 数据库的 postgresql:// 连接 URL
  databaseUrl: ""
  # settings.jwtToken -- 与 pageserver 认证的 JWT token
  jwtToken: ""
  # -- 与 safekeeper 认证的 JWT token
  safekeeperJwtToken: ""
  # -- 与其他 storage controller 实例认证的 JWT token
  peerJwtToken: ""
  # settings.publicKey -- 用于验证传入 HTTP 请求的公钥
  publicKey: ""
  # settings.controlPlaneJwtToken -- 用于调用 controlPlaneUrl 认证的 JWT token
  controlPlaneJwtToken: ""
  # -- Control Plane API 的基础 URL（例如 https://control-plane.example.com/storage/api/v1/）
  controlPlaneUrl: ""
  # -- Control Plane Management API 的基础 URL（例如 https://control-plane.example.com:1000/）
  lbmManagementUrl: ""
  # -- Control Plane Storage API 的基础 URL（例如 https://control-plane.example.com:1002/storage/api/v1/）
  lbmStorageUrl: ""
  # -- 运行反熵后台任务的间隔（例如，每天一次、每小时一次、每周一次）
  antiEntropyJobInterval: ""
  # -- 两个独立 tenant 之间的延迟时间，避免 API 请求耗尽 LBM
  antiEntropyJobDelay: ""
  # -- 如果为 true，则实际对不匹配项执行操作，修正 storcon 条目（必要时 detach，必要时调整 tenant 配置）
  antiEntropyJobEnact: false
  # settings.heartbeatInterval -- 向已注册节点发送心跳的周期
  heartbeatInterval: ""
  # settings.maxOfflineInterval -- 将无响应的 pageserver 标记为 offline 之前的宽限期
  maxOfflineInterval: ""
  # settings.maxWarmingUpInterval -- 扩展宽限期，在此时间内 pageserver 可能不响应
  # 心跳。在节点被 drain 以进行重启后和/或处理来自节点的
  # re-attach 请求时生效。
  maxWarmingUpInterval: ""
  # settings.initialSplitThreshold -- 初始 tenant 拆分的字节大小阈值
  initialSplitThreshold: ""
  # settings.initialSplitShards -- 初始 tenant 拆分时使用的 shard 数量
  initialSplitShards: ""
  # settings.splitThreshold -- 自动拆分 shard 的字节大小阈值。不设置则禁用自动分片（默认）
  splitThreshold: ""
  # settings.maxSplitShards -- 自动拆分的最大 shard 数量
  maxSplitShards: ""
  # settings.lazyDrainsFills -- 如果为 true，对节点 drain 和 fill 使用延迟挂载（lazy attach）
  lazyDrainsFills: ""
  # -- 混沌测试：tenant 迁移间隔
  chaosInterval: ""
  # -- 混沌测试：立即退出的 crontab 配置
  chaosExitCrontab: ""
  # -- 混沌测试：timeline safekeeper 迁移间隔
  chaosSafekeeperInterval: ""
  # -- 启用后，在小型（<20GB）shard 拆分中触发并等待参考 timeline digest，拆分后触发拆分后 digest 并检查其是否与参考值一致
  checkTimelineDigestAcrossSmallShardSplits: false
  # -- 后台一致性检查的间隔
  consistencyCheckInterval: ""
  # -- 设置为 True 时，优雅重启服务
  startAsCandidate: false
  # -- 是否同样在 safekeeper 上创建 timelines
  timelinesOntoSafekeepers: false
  # -- 如果一次 reconcile 耗时超过此值，则触发告警指标
  longReconcileThreshold: "30min"
  # -- neon_region 标签，用于 neon.com 可观测性栈
  neonRegion: ""
  # -- neon_cloud 标签，用于 neon.com 可观测性栈
  neonCloud: ""
  # -- 启用后，开启 location_updates 子系统
  enableLocationUpdates: false
  # -- Posthog 配置
  posthogConfig: {}
  # -- 是否启用 pageserver tenant shard 自动迁移
  pageserverAutoMigrationEnabled: false
  # -- 每个目标节点最大并发迁移数
  pageserverAutoMigrationMaxMigrationsPerDestination: ""
  # -- 触发迁移的源节点最小磁盘使用百分比
  pageserverAutoMigrationDiskUtilizationSourceMin: ""
  # -- 触发迁移的源节点最小实际磁盘使用百分比
  pageserverAutoMigrationDiskActualUsageSourceMin: ""
  # -- 迁移后源节点目标磁盘使用百分比
  pageserverAutoMigrationDiskUtilizationSourceTarget: ""
  # -- 目标节点最大磁盘使用百分比
  pageserverAutoMigrationDiskUtilizationDestinationMax: ""
  # -- 迁移的最大 shard 大小限制
  pageserverAutoMigrationMaxShardSizeLimit: ""


# registerControlPlane -- 启用自动注册到 Control Plane（将运行 post-install Job）。
# 当前部署未对接真实 Control Plane，默认关闭。
registerControlPlane:
  # registerControlPlane.enable -- 是否启用自动注册
  enable: false
  # registerControlPlane.region_id -- region ID，用于向 Control Plane 注册时标识区域
  region_id: ""
  # registerControlPlane.controlPlaneJwtToken -- 向 Control Plane 认证的 JWT token
  controlPlaneJwtToken: ""
  # registerControlPlane.cplane_url -- Control Plane API 的基础 URL
  cplane_url: ""
  # registerControlPlane.host -- Storage Controller 对外暴露的主机名
  host: ""
  # registerControlPlane.port -- Storage Controller 对外暴露的端口
  port: ""
  # registerControlPlane.resources -- post-install Job 的资源限制
  resources:
    limits:
      cpu: 100m
      memory: 128M
    requests:
      cpu: 100m
      memory: 128M

serviceAccount:
  # serviceAccount.create -- 指定是否创建 ServiceAccount
  create: true
  # serviceAccount.annotations -- 添加到 ServiceAccount 的注解
  annotations: {}
  # serviceAccount.name -- 要使用的 ServiceAccount 名称。
  # 如果未设置且 create 为 true，则使用 fullname 模板生成名称
  name: ""

# -- neon-storage-controller Pod 的注解
podAnnotations: {}

# -- neon-storage-controller Pod 的附加标签
podLabels: {}
  # neon_service: controller
  # neon_env: staging
  # neon_region: us-west-1
  # neon_region_slug: virginia

# -- neon-storage-controller Pod 安全上下文
podSecurityContext: {}
  # fsGroup: 2000

# -- neon-storage-controller 容器安全上下文
securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  # service.annotations -- 添加到 Service 的注解
  annotations: {}
  # service.type -- Service 类型（ClusterIP / LoadBalancer）
  type: ClusterIP
  # service.port -- 控制器监听端口（gRPC）
  port: 50051

ingress:
  # ingress.enabled -- 启用 Ingress 控制器资源
  enabled: false    # 默认无需开启，暂不需暴露到集群外部
  # ingress.className -- 控制器的 Ingress 类
  className: nginx-int
  # ingress.annotations -- Ingress 资源的附加注解
  annotations: {}
    # external-dns.alpha.kubernetes.io/hostname: chart-example.local
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          # https://kubernetes.io/docs/concepts/services-networking/ingress/#path-types
          pathType: Prefix
          protocol: TCP
# resources -- Storage Controller 容器的资源限制与请求
resources:
  # resources.limits.cpu -- CPU 上限
  limits:
    cpu: "2"
    memory: 2Gi
  # resources.requests.cpu -- CPU 请求
  requests:
    cpu: "1"
    memory: 256Mi

# -- Pod 节点选择器标签
nodeSelector: {}

# -- Pod 容忍调度配置
tolerations: []

# -- Pod 亲和性调度配置
affinity: {}

# -- Pod 优先级类
priorityClassName: ""

metrics:
  # metrics.enabled -- 启用 Prometheus 指标自动发现
  enabled: false
  ## Prometheus Operator ServiceMonitor 配置
  ##
  serviceMonitor:
    # metrics.serviceMonitor.enabled -- 创建 ServiceMonitor 资源
    enabled: false

    # metrics.serviceMonitor.namespace -- 创建 ServiceMonitor 的命名空间，为空则使用 Release.Namespace
    namespace: ""

    ## 指标抓取间隔。
    ## 参考: https://github.com/coreos/prometheus-operator/blob/master/Documentation/api.md#endpoint
    ##
    # metrics.serviceMonitor.interval -- Prometheus 抓取间隔
    interval: 10s

    ## 抓取超时时间
    ## 参考: https://github.com/coreos/prometheus-operator/blob/master/Documentation/api.md#endpoint
    ##
    # metrics.serviceMonitor.scrapeTimeout -- Prometheus 抓取超时时间
    scrapeTimeout: 10s

    ## ServiceMonitor 选择器标签
    ## 参考: https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack#prometheusioscrape
    ##
    # metrics.serviceMonitor.selector -- 附加标签（供 Prometheus operator 使用）
    selector: {}
    # selector:
    #   prometheus: neon


# -- 随 Chart 一同创建的额外 Kubernetes 资源清单
extraManifests: []
