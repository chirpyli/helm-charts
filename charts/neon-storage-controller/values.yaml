# Default values for neon-storage-controller.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# 全局配置（umbrella chart 的 global.jwt 自动合并到此处；独立部署时留空即可）
global:
  jwt: {}

image:
  # -- Neondatabase image repository
  repository: neondatabase/neon
  # -- image pull policy
  pullPolicy: IfNotPresent
  # -- Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

# -- Specify docker-registry secret names as an array
imagePullSecrets: []

# -- String to partially override neon-storage-controller.fullname template (will maintain the release name)
nameOverride: ""
# -- String to fully override neon-storage-controller.fullname template
fullnameOverride: ""

# Neon controller settings
settings:
  # settings.sentryUrl -- url (will be converted into `SENTRY_DSN` environment variable) used by sentry to collect error/panic events in storage-controller
  sentryUrl: ""
  # settings.sentryEnvironment -- "development" or "production". It will be visible in sentry in order to filter issues
  sentryEnvironment: "development"
  # -- 外部 PostgreSQL 连接串所在的 Secret 名称
  databaseUrlSecretName: "storage-controller-pg-cluster"
  # -- 上述 Secret 中存放连接串的键名。
  databaseUrlSecretKey: "uri"
  # -- 共享 JWT Secret 名称（外部预建，键契约见 charts/neon/templates/NOTES.txt）。
  # storage_controller 通过环境变量读取密钥（见 storage_controller/src/main.rs 的 Secrets::load），
  # chart 以 secretKeyRef 从该 Secret 注入：
  #   PUBLIC_KEY                <- publicKey.pem
  #   PAGESERVER_JWT_TOKEN      <- pageserverJwtToken
  #   SAFEKEEPER_JWT_TOKEN      <- safekeeperJwtToken
  #   CONTROL_PLANE_JWT_TOKEN   <- controlPlaneJwtToken
  #   PEER_JWT_TOKEN            <- peerJwtToken
  # 因此这里不再提供任何 token / 公钥的明文入口：放在 values 里会被写进本 chart 自建的
  # Secret，最终同时存在于两处，既扩大暴露面也让轮换必须走 helm upgrade。
  # 留空时回退 global.jwt.existingSecret > global.jwt.secretName。
  jwtSecretName: ""
  # -- Base URL for control plane API endpoints (e.g., https://control-plane.example.com/storage/api/v1/)
  controlPlaneUrl: ""
  # -- Base URL for control plane management API (e.g., https://control-plane.example.com:1000/)
  lbmManagementUrl: ""
  # -- Base URL for control plane storage API (e.g., https://control-plane.example.com:1002/storage/api/v1/)
  lbmStorageUrl: ""
  # -- Interval at which to run the anti entropy background job (e.g., once per day, hour, week)
  antiEntropyJobInterval: ""
  # -- Delay between two individual tenants, to not exhaust the LBM with API requests
  antiEntropyJobDelay: ""
  # -- If true, actually act on the mismatches, correcting storcon entries (detach if needed, adjust tenant config if needed)
  antiEntropyJobEnact: false
  # settings.heartbeatInterval -- Period with which to send heartbeats to registered nodes.
  heartbeatInterval: ""
  # settings.maxOfflineInterval -- Grace period before marking unresponsive pageserver offline.
  maxOfflineInterval: ""
  # settings.maxWarmingUpInterval -- Extended grace period within which pageserver may not respond
  # to heartbeats. Kicks in after the node has been drained for restart and/or upon handling the
  # re-attach request from a node.
  maxWarmingUpInterval: ""
  # settings.initialSplitThreshold -- Size threshold in bytes for initial tenant splits.
  initialSplitThreshold: ""
  # settings.initialSplitShards -- Number of shards to use for initial tenant splits.
  initialSplitShards: ""
  # settings.splitThreshold -- Shard size threshold in bytes for automatically splitting shards.  Omit to disable auto-sharding (default)
  splitThreshold: ""
  # settings.maxSplitShards -- Maximum number of shards for autosplits.
  maxSplitShards: ""
  # settings.lazyDrainsFills -- If true, use lazy attaches for node drains and fills.
  lazyDrainsFills: ""
  # -- Chaos testing for tenant migration interval
  chaosInterval: ""
  # -- Chaos testing for immediate exit crontab
  chaosExitCrontab: ""
  # -- Chaos testing for timeline safekeeper migration interval
  chaosSafekeeperInterval: ""
  # -- When set, in small (<20GB) shard splits trigger and wait for a reference timeline digest, then split, then trigger a post-digest and check that it equals the reference.
  checkTimelineDigestAcrossSmallShardSplits: false
  # -- Interval for the background consistency check
  consistencyCheckInterval: ""
  # -- When set to True, restart the service gracefully
  startAsCandidate: false
  # -- Whether to create timelines on safekeepers as well
  timelinesOntoSafekeepers: false
  # -- If a reconciliation takes longer than this, bump an alerting metric
  longReconcileThreshold: "30min"
  # -- The neon_region label as it would be set in the neon.com observability stack.
  neonRegion: ""
  # -- The neon_cloud label as it would be set in the neon.com observability stack.
  neonCloud: ""
  # -- When set, enable location_updates subsystem
  enableLocationUpdates: false
  # -- Posthog config
  posthogConfig: {}
  # -- Whether to enable automatic pageserver tenant shard migrations
  pageserverAutoMigrationEnabled: false
  # -- Maximum number of concurrent migrations per destination node
  pageserverAutoMigrationMaxMigrationsPerDestination: ""
  # -- Minimum disk utilization percentage on source node to trigger migration
  pageserverAutoMigrationDiskUtilizationSourceMin: ""
  # -- Minimum actual disk usage percentage on source node to trigger migration
  pageserverAutoMigrationDiskActualUsageSourceMin: ""
  # -- Target disk utilization percentage for source node after migration
  pageserverAutoMigrationDiskUtilizationSourceTarget: ""
  # -- Maximum disk utilization percentage on destination node
  pageserverAutoMigrationDiskUtilizationDestinationMax: ""
  # -- Maximum shard size limit for migration
  pageserverAutoMigrationMaxShardSizeLimit: ""


# Enable auto register to control plane
# This will run postinstall job
registerControlPlane:
  enable: false
  # -- region_id 标识（如 us-east-1）
  region_id: ""
  # -- storage_controller 对外可访问的主机名（job 注册到 control-plane 时用作节点 host）
  host: ""
  # -- storage_controller 的 HTTP 端口（默认与 service.port 一致）
  port: 50051
  # -- control plane API URL（如 https://control-plane.example.com/storage/api/v1/）
  cplane_url: ""
  # 注意：调用 control plane API 的 JWT token 不再通过此字段填写。
  # 注册 Job 改为从共享 JWT Secret 的 controlPlaneJwtToken 键读取（需设置 global.jwt.existingSecret），
  # 因此 enable=true 时若未配置共享 Secret，渲染阶段会直接报错。
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi
  # -- 注册 Job 的 init 容器镜像（需包含 kubectl，用于探测节点 zone 标签）。
  # 默认复用控制面镜像 neondatabase/neon：集群节点已验证可拉取且内置 /usr/bin/kubectl。
  # 不要用 bitnami/kubectl（本环境镜像代理白名单不含 bitnami/*，拉取会 not found）。
  # 私有仓库/离线环境可覆盖为可达镜像。
  kubectlImage: "neondatabase/neon:latest"

serviceAccount:
  # serviceAccount.create - Specifies whether a service account should be created
  create: true
  # serviceAccount.annotations -- Annotations to add to the service account
  annotations: {}
  # serviceAccount.name - The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# -- Annotations for neon-storage-controller pods
podAnnotations: {}

# -- Additional labels for neon-storage-controller pods
podLabels: {}
  # neon_service: controller
  # neon_env: staging
  # neon_region: us-west-1
  # neon_region_slug: virginia

# -- neon-storage-controller's pods Security Context
podSecurityContext: {}
  # fsGroup: 2000

# -- neon-storage-controller's containers Security Context
securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# -- pod 终止宽限期（秒）
terminationGracePeriodSeconds: 30

service:
  # service.annotations -- Annotations to add to the service
  annotations: {}
  type: ClusterIP
  # service.port -- controller listen port
  port: 50051

ingress:
  # ingress.enabled -- Enable ingress controller resource.
  enabled: true
  # ingress.className -- Ingress class for controller
  className: nginx-int
  # ingress.annotations -- Additional annotations for Ingress resource.
  annotations: {}
    # external-dns.alpha.kubernetes.io/hostname: chart-example.local
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          # https://kubernetes.io/docs/concepts/services-networking/ingress/#path-types
          pathType: Prefix
          protocol: TCP
resources:
  # limits == requests to achieve `Guaranteed` QoS class
  # => https://kubernetes.io/docs/concepts/workloads/pods/pod-qos/#guaranteed
  limits:
    cpu: "2"
    memory: 4Gi
  requests:
    cpu: "2"
    memory: 4Gi

# -- Node labels for pod assignment.
nodeSelector: {}

# -- Tolerations for pod assignment.
tolerations: []

# -- Affinity for pod assignment
affinity: {}

# -- Pod priority class
priorityClassName: ""

metrics:
  # metrics.enabled -- Enable prometheus metrcis autodiscovery
  enabled: false
  ## Prometheus Operator ServiceMonitor configuration
  ##
  serviceMonitor:
    # metrics.serviceMonitor.enabled -- Create ServiceMonitor resource
    enabled: false

    # metrics.serviceMonitor.namespace -- The namespace in which the ServiceMonitor will be created, if empty then Release.Namespace used
    namespace: ""

    ## Interval at which metrics should be scraped.
    ## ref: https://github.com/coreos/prometheus-operator/blob/master/Documentation/api.md#endpoint
    ##
    # metrics.serviceMonitor.interval -- Interval in which prometheus scrapes
    interval: 10s

    ## Timeout after which the scrape is ended
    ## ref: https://github.com/coreos/prometheus-operator/blob/master/Documentation/api.md#endpoint
    ##
    # metrics.serviceMonitor.scrapeTimeout -- Scrape Timeout duration for prometheus
    scrapeTimeout: 10s

    ## ServiceMonitor selector labels
    ## ref: https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack#prometheusioscrape
    ##
    # metrics.serviceMonitor.selector -- Additional labels to attach (used by Prometheus operator)
    selector: {}
    # selector:
    #   prometheus: neon


# -- Additional manifests that are created with the chart
extraManifests: []
