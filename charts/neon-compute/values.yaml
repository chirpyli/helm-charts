# Default values for neon-compute.
# 静态示例 compute：运行 compute_ctl，从 --config /spec.json 加载 control plane 生成的 ComputeSpec。
# 推荐用法：先经 control plane 的 POST /projects/{id}/endpoints 拿到 spec，将其中 spec 字段填入 settings.spec。

image:
  # compute_ctl 二进制只存在于 compute-node 专用镜像（而非 neondatabase/neon 通用镜像）。
  repository: neondatabase/compute-node-v17
  pullPolicy: IfNotPresent
  # 镜像 tag。⚠️ 生产禁止使用 latest（不可重现），请 pin 到具体版本或 digest，如 "v17-<commit>"。
  # 全仓库组件当前统一用 latest，部署前请统一替换为受控版本。
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

settings:
  # -- compute 连接本地 postgres 的 connstr
  connstr: "postgresql://cloud_admin@localhost/postgres"
  # -- postgres 数据目录
  pgdata: /var/db/postgres/data
  # -- postgres 二进制路径（compute-node 镜像中为 /usr/local/bin/postgres）
  pgbin: /usr/local/bin/postgres
  # -- compute_ctl 外部 http 端口
  externalHttpPort: 3080
  # -- 由 control plane 生成的完整 ComputeSpec（JSON 字符串）。【必填】
  # ⚠️ 默认值含占位符（storage_auth_token / encrypted_password 为 <...>），直接部署会启动一个
  #    无法连 pageserver、无法认证的 compute。必须通过 --set-file settings.spec=<真实spec.json> 或
  #    在 values 中替换为 control plane 实际生成的值后再部署（chart 会在渲染时校验占位符并中断）。
  # 关键字段：
  #   storage_auth_token 必须是 control plane 用同一私钥签发的 tenant scope JWT（pageserver/safekeeper 用公钥校验）
  #   cluster.roles[].encrypted_password 必须是 SCRAM-SHA-256 验证器（与 proxy role_secret 一致）
  # 地址需指向 umbrella 内的 StatefulSet 稳定 DNS；token/密码需替换为 control plane 实际生成值。
  spec: |
    {
      "format_version": 1.0,
      "tenant_id": "3d1f7595b468230304e0b73cecbcb081",
      "timeline_id": "main",
      "mode": "Primary",
      "pageserver_connection_info": {
        "shard_count": 0,
        "stripe_size": 0,
        "shards": {
          "0": { "pageservers": [ { "id": 1000, "libpq_url": "postgresql://neon-pageserver-0.neon-pageserver-hl-svc:64000", "grpc_url": "http://neon-pageserver-0.neon-pageserver-hl-svc:9898" } ] }
        }
      },
      "safekeeper_connstrings": [
        "neon-safekeeper-0.neon-safekeeper-hl-svc:5454",
        "neon-safekeeper-1.neon-safekeeper-hl-svc:5454",
        "neon-safekeeper-2.neon-safekeeper-hl-svc:5454"
      ],
      "storage_auth_token": "<由 control plane 签发的 tenant scope JWT>",
      "cluster": {
        "roles": [ { "name": "cloud_admin", "encrypted_password": "<SCRAM-SHA-256 验证器>" } ],
        "databases": [ { "name": "postgres", "owner": "cloud_admin" } ],
        "settings": {}
      }
    }

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  pgPort: 5432
  httpPort: 3080

resources:
  limits:
    cpu: "500m"
    memory: 512Mi
  requests:
    cpu: "500m"
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""

metrics:
  enabled: false
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: 10s
    scrapeTimeout: 10s
    selector: {}

extraManifests: []
