image:
  repository: ghcr.io/neondatabase/compute-node-v16
  pullPolicy: Always
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Deployment 配置
replicas: 1

# Compute 配置
pgVersion: 16
computeId: "compute-1"
port: 55433
devMode: true

# 由 initJob 填充（tenant 创建后写入）
tenantId: ""
timelineId: ""

# Pageserver 连接（支持多副本）
# 当 replicas > 1 时，通过 headless service DNS 自动生成所有 pageserver pod 的连接信息
# 生成的 pageserver_connstring 格式：
#   "host=pod-0.headless-svc port=6400,host=pod-1.headless-svc port=6400,..."
pageservers:
  replicas: 1
  podNamePrefix: "neon-stack-neon-pageserver"
  headlessService: "neon-stack-neon-pageserver-headless"
  port: 6400
# 兼容旧配置：当 pageservers.replicas 为 1 时，优先使用此处的 host
pageserver:
  host: "neon-pageserver"
  port: 6400

# Safekeeper 连接（格式: host=<host> port=<port>）
safekeepers:
  - host: "neon-safekeeper-0.neon-safekeeper-headless"
    port: 5454
  - host: "neon-safekeeper-1.neon-safekeeper-headless"
    port: 5454
  - host: "neon-safekeeper-2.neon-safekeeper-headless"
    port: 5454

# LFC（Local File Cache）本地盘配置
lfc:
  maxFileCacheSizeMB: 4096
  mountPath: "/lfc"

# 网络
service:
  type: ClusterIP
  port: 55433
  httpPort: 3080

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

resources:
  limits:
    cpu: "4"
    memory: 4Gi
  requests:
    cpu: "1"
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""
extraManifests: []
