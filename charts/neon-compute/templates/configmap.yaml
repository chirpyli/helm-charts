apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "neon-compute.fullname" . }}-config
  labels:
    {{- include "neon-compute.labels" . | nindent 4 }}
data:
  # 由 control plane 生成的 ComputeSpec（JSON）。compute_ctl 以 --config 加载。
  # 若仍含占位符（<...>），说明未替换为真实 spec，直接中断渲染以避免部署无法工作的 compute。
  {{- if contains "<" .Values.settings.spec }}
  {{- fail "neon-compute: settings.spec 仍含占位符（<...>），请替换为 control plane 生成的真实 ComputeSpec（含有效 storage_auth_token 与 SCRAM 密码）后再部署" }}
  {{- end }}
  spec.json: |
{{ .Values.settings.spec | indent 4 }}
