# Default values for neon-pageserver.
# 本 chart 部署有状态的 pageserver 节点（StatefulSet + PVC）。

# 全局配置（umbrella 化时由父 chart 的 global 覆盖；此处声明为保证独立 lint/渲染 .Values.global 为 map）
global: {}

image:
  # -- Neondatabase 镜像仓库（含 pageserver / safekeeper / compute_ctl 等二进制）
  repository: neondatabase/neon
  # -- 镜像拉取策略
  pullPolicy: IfNotPresent
  # -- 覆盖镜像 tag（默认取 chart appVersion）
  tag: "latest"

# -- docker-registry secret 列表
imagePullSecrets: []

# -- 部分覆盖 fullname 模板
nameOverride: ""
# -- 完全覆盖 fullname 模板
fullnameOverride: ""

# pageserver 运行配置（对应 pageserver.toml 的关键字段）
settings:
  # -- storage_broker 地址（WAL 流节点发现）。umbrella 下默认指向 neon-broker-svc
  brokerEndpoint: "http://neon-broker-svc:50051"
  # -- storage_controller 基址（不含 /upcall/v1 前缀，模板会自动追加）。umbrella 下默认指向 neon-storage-controller-svc
  storageControllerUrl: "http://neon-storage-controller-svc:50051"
  # -- SC→PS 的 PageServerApi JWT（来自全局 jwt Secret，umbrella 透传）。留空时 pageserver 启动时鉴权失败，需由 umbrella 注入
  storageControllerApiToken: ""
  # -- 可用区标识
  availabilityZone: "az1"
  # -- PostgreSQL 二进制根目录（pageserver 据此找 v<major>/bin/initdb 与 lib）。
  # 镜像内二进制位于 /usr/local/v{14..17}，必须显式指向 /usr/local，否则默认工作目录找不到 initdb
  pgDistribDir: "/usr/local"
  # -- 对象存储（外部 MinIO / S3）。凭证由 bucket-credentials Secret 经环境变量注入
  remoteStorage:
    bucketName: "neondata"
    bucketRegion: "us-east-1"
    endpoint: "http://192.168.232.128:9000"
    prefixInBucket: "pageserver"
  # -- 共享 JWT 公钥 Secret 名称（存放 publicKey.pem 等），由 umbrella 统一创建
  jwtSecretName: "neon-jwt"

serviceAccount:
  # serviceAccount.create -- 是否创建 ServiceAccount
  create: true
  # serviceAccount.annotations -- SA 注解
  annotations: {}
  # serviceAccount.name -- 显式指定 SA 名
  name: ""

# -- Pod 注解
podAnnotations: {}
# -- Pod 额外标签
podLabels: {}
# -- Pod 安全上下文
podSecurityContext: {}
# -- 容器安全上下文
securityContext: {}

# StatefulSet 专属配置
statefulSet:
  # -- 副本数（默认 1；如需分片调度可增大，但单租户单分片下通常 1~3）
  replicas: 1
  # node id 基址：每个 pod 的 id = nodeIdBase + StatefulSet ordinal
  nodeIdBase: 1000
  # -- PVC 持久化（tenant 层数据；测试环境可适当调小，生产建议 >= 50Gi + 本地 SSD StorageClass）
  storage:
    size: 5Gi
    # storageClassName -- 留空使用集群默认 StorageClass；生产建议指定本地盘 StorageClass
    storageClassName: ""
    mountPath: /home/postgres/pageserver
  # -- Guaranteed QoS：requests == limits（测试环境内存调小；生产建议 CPU >= 4 / 内存 >= 8Gi）
  resources:
    limits:
      cpu: "500m"
      memory: 512Mi
    requests:
      cpu: "500m"
      memory: 512Mi

service:
  # -- 集群内访问类型（SC / compute 连接）
  type: ClusterIP
  # -- pg/libpq 端口
  pgPort: 64000
  # -- HTTP 管理端口（SC 调用 / 探针 /metrics）
  httpPort: 9898
  # -- HTTPS 管理端口
  httpsPort: 9899
  # -- gRPC 实验端口
  grpcPort: 51051

# PodDisruptionBudget
podDisruptionBudget:
  # 单副本（Recreate 语义）允许 1 个不可用；多副本建议设 minAvailable
  minAvailable: 0
  maxUnavailable: 1

# -- 节点选择
nodeSelector: {}
# -- 容忍
tolerations: []
# -- 亲和性（建议 podAntiAffinity 跨节点分布）
affinity: {}
# -- 优先级类
priorityClassName: ""

# -- pageserver 容器内 PostgreSQL 二进制的 lib 搜索路径。
# pageserver 拉起时间线（initdb）与运行 postgres 子进程时依赖 libpq 等动态库，
# 必须将其 lib 目录加入 LD_LIBRARY_PATH（镜像内置于 /usr/local/v{14..17}/lib），
# 否则 spawn initdb 会因找不到 libpq.so.5 而 ENOENT 失败。
ldLibraryPath: "/usr/local/v14/lib:/usr/local/v15/lib:/usr/local/v16/lib:/usr/local/v17/lib"

# -- 监控开关（复用 storage-controller 同款 ServiceMonitor 结构）
metrics:
  enabled: false
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: 10s
    scrapeTimeout: 10s
    selector: {}

# -- 额外清单
extraManifests: []
