# neon-pageserver 默认配置值。
# 这是一个 YAML 格式的文件。
# 在此声明要传递给模板的变量。

# 镜像配置
image:
  # -- Neondatabase 镜像仓库
  repository: neondatabase/neon
  # -- 镜像拉取策略
  pullPolicy: Always
  # -- 覆盖镜像标签，默认为 Chart 的 appVersion
  tag: "latest"

# init 容器镜像（metadata 初始化）
initContainer:
  # -- init 容器镜像仓库
  repository: docker.m.daocloud.io/library/busybox
  # -- init 容器镜像标签
  tag: "latest"
  # -- init 容器镜像拉取策略
  pullPolicy: IfNotPresent

# -- 指定 docker-registry 的 Secret 名称数组
imagePullSecrets: []

# -- 部分覆盖 neon-pageserver.fullname 模板的字符串（保留发布名称）
nameOverride: ""
# -- 完全覆盖 neon-pageserver.fullname 模板的字符串
fullnameOverride: ""

# StatefulSet 配置
# -- Pageserver 副本数（开发阶段为 1， 后续生产建议2以上）
replicas: 1
# -- Pageserver 节点 ID 基数（node_id = baseId，MVP 单副本；多副本时用于分配唯一 ID）
baseId: 1

# Pageserver 配置
settings:
  # -- Storage Broker 地址
  brokerEndpoint: "http://neon-storage-broker:50051"
  # -- PostgreSQL 协议监听地址
  listenPgAddr: "0.0.0.0:6400"
  # -- HTTP API 监听地址
  listenHttpAddr: "0.0.0.0:9898"
  # -- PostgreSQL 发行版目录
  pgDistribDir: "/usr/local/"
  # -- Storage Controller API 地址（非 emergency mode 自动注册）
  controlPlaneApi: "http://neon-storage-controller:50051/upcall/v1"
  # -- 虚拟文件 IO 模式
  virtualFileIoMode: "buffered"
  # -- HTTP 认证模式（Trust 表示无需 JWT）
  httpAuth: "Trust"

# 远程存储（S3 / MinIO）
remoteStorage:
  # -- 远程存储路径前缀
  prefixInBucket: "/pageserver"

# S3 凭证
s3Credentials:
  # -- 引用已存在的 Secret 名称（包含 AWS_ACCESS_KEY_ID、AWS_SECRET_ACCESS_KEY、AWS_ENDPOINT_URL、BUCKET_NAME、AWS_REGION）
  existingSecret: "bucket-credentials"

# 本地盘驱逐策略
diskUsageEviction:
  # -- 启用本地磁盘使用驱逐
  enabled: true
  # -- 磁盘使用百分比上限
  maxUsagePct: 80
  # -- 最小可用字节数
  minAvailBytes: 0

# 持久化存储
persistence:
  # -- 启用持久化存储
  enabled: true
  # -- 持久卷大小
  size: 10Gi

# 网络配置
service:
  # Headless Service（必须）：SC 点对点路由
  headless:
    # -- Headless Service 名称（空值则自动使用 {release}-neon-pageserver-headless）
    name: ""
  # ClusterIP Service（可选）：单副本时便于外部访问
  clusterIP:
    # -- 启用 ClusterIP Service
    enabled: true
    # -- ClusterIP Service 名称（空值则自动使用 {release}-neon-pageserver）
    name: ""

# Prometheus 指标配置
metrics:
  # -- 启用 Prometheus 指标自动发现
  enabled: false
  ## Prometheus Operator ServiceMonitor 配置
  ##
  serviceMonitor:
    # -- 创建 ServiceMonitor 资源
    enabled: false

    # -- 创建 ServiceMonitor 的命名空间，为空则使用 Release.Namespace
    namespace: ""

    ## 指标抓取间隔。
    ## 参考: https://github.com/coreos/prometheus-operator/blob/master/Documentation/api.md#endpoint
    ##
    # -- Prometheus 抓取间隔
    interval: 10s

    ## 抓取超时时间
    ## 参考: https://github.com/coreos/prometheus-operator/blob/master/Documentation/api.md#endpoint
    ##
    # -- Prometheus 抓取超时时间
    scrapeTimeout: 10s

    ## ServiceMonitor 选择器标签
    ## 参考: https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack#prometheusioscrape
    ##
    # -- 附加标签（供 Prometheus operator 使用）
    selector: {}
    # selector:
    #   prometheus: neon

serviceAccount:
  # serviceAccount.create - 指定是否创建 ServiceAccount
  create: true
  # serviceAccount.annotations -- 添加到 ServiceAccount 的注解
  annotations: {}
  # serviceAccount.name - 要使用的 ServiceAccount 名称。
  # 如果未设置且 create 为 true，则使用 fullname 模板生成名称
  name: ""

# -- neon-pageserver Pod 的注解
podAnnotations: {}

# -- neon-pageserver Pod 的附加标签
podLabels: {}

# -- neon-pageserver Pod 安全上下文
podSecurityContext: {}
  # fsGroup: 2000

# -- neon-pageserver 容器安全上下文
securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# 资源限制
resources:
  limits:
    cpu: "4"
    memory: 4Gi
  requests:
    cpu: "1"
    memory: 512Mi

# -- Pod 节点选择器标签
nodeSelector: {}

# -- Pod 容忍调度配置
tolerations: []

# -- Pod 亲和性调度配置
affinity: {}

# -- Pod 优先级类
priorityClassName: ""

# -- 随 Chart 一同创建的额外 Kubernetes 资源清单
extraManifests: []
