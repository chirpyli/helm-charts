apiVersion: v1
kind: Service
metadata:
  name: {{ include "neon-pageserver.headlessServiceName" . }}
  labels:
    {{- include "neon-pageserver.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: http
      port: 9898
      targetPort: http
      protocol: TCP
    - name: pg
      port: 6400
      targetPort: pg
      protocol: TCP
    - name: grpc
      port: 50051
      targetPort: grpc
      protocol: TCP
  selector:
    {{- include "neon-pageserver.selectorLabels" . | nindent 4 }}
