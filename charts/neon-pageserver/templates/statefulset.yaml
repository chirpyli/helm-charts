apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "neon-pageserver.fullname" . }}
  labels:
    {{- include "neon-pageserver.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "neon-pageserver.headlessServiceName" . }}
  replicas: {{ .Values.replicas }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "neon-pageserver.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "neon-pageserver.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "neon-pageserver.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName | quote }}
      {{- end }}
      initContainers:     # 初始化容器
        - name: init-metadata
          image: "{{ .Values.initContainer.repository }}:{{ .Values.initContainer.tag }}"
          imagePullPolicy: {{ .Values.initContainer.pullPolicy }}
          command:
            - sh
            - -c
            - |
              # 初始化 metadata.json 和 identity.toml（仅在首次创建时写入）
              METADATA_FILE="/data/.neon/metadata.json"
              if [ ! -f "$METADATA_FILE" ]; then
                mkdir -p /data/.neon

                HEADLESS_DNS="${POD_NAME}.{{ include "neon-pageserver.headlessServiceName" . }}.${POD_NAMESPACE}.svc.cluster.local"

                # metadata.json — 节点元数据，用于 storage controller 注册
                cat > "$METADATA_FILE" << EOF
              {
                "host": "${HEADLESS_DNS}",
                "port": 6400,
                "http_host": "${HEADLESS_DNS}",
                "http_port": 9898,
                "grpc_host": "${HEADLESS_DNS}",
                "grpc_port": 50051,
                "https_port": 0,
                "availability_zone_id": "az1"
              }
              EOF

                # identity.toml — pageserver 节点 ID，启动时必需
                # baseId + pod 序号 = 节点唯一 ID
                ORDINAL="${POD_NAME##*-}"
                NODE_ID=$(({{ .Values.baseId }} + ORDINAL))
                cat > "/data/.neon/identity.toml" << IDEOF
              id = ${NODE_ID}
              IDEOF

                # busybox init 容器以 root 运行，neon 主容器以 nonroot 运行，
                # 需要让主容器也能写入 /data/.neon/ 目录
                chmod 777 /data/.neon

                echo "metadata.json and identity.toml created successfully (node_id=${NODE_ID})."
              else
                # 确保权限正确（pod 重启后 PVC 权限可能丢失）
                chmod 777 /data/.neon
                echo "metadata.json already exists, skipping initialization."
              fi
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              # pageserver 从 workdir 读取 pageserver.toml（不支持 envsubst，需手动替换环境变量）
              # 使用 awk 进行占位符替换，避免 shell 转义问题
              # 在主容器启动时确保 /data/.neon 目录可写（uid 1000）
              mkdir -p /data/.neon
              chmod 777 /data/.neon 2>/dev/null || true

              # 调试：打印环境变量是否存在
              echo "DEBUG: AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL}"
              echo "DEBUG: BUCKET_NAME=${BUCKET_NAME}"
              echo "DEBUG: AWS_REGION=${AWS_REGION}"

              awk '{
                gsub(/\$\(AWS_ENDPOINT_URL\)/, ENVIRON["AWS_ENDPOINT_URL"]);
                gsub(/\$\(BUCKET_NAME\)/, ENVIRON["BUCKET_NAME"]);
                gsub(/\$\(AWS_REGION\)/, ENVIRON["AWS_REGION"]);
                print;
              }' /config/pageserver.toml > /data/.neon/pageserver.toml
              echo "=== pageserver.toml ===" && cat /data/.neon/pageserver.toml
              exec pageserver -D /data/.neon
          env:
            - name: RUST_LOG
              value: "INFO"
            - name: NODE_IP_ADDR
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          envFrom:
            - secretRef:
                name: {{ .Values.s3Credentials.existingSecret }}
          ports:
            - name: pg
              containerPort: 6400
              protocol: TCP
            - name: http
              containerPort: 9898
              protocol: TCP
            - name: grpc
              containerPort: 50051
              protocol: TCP
          startupProbe:
            httpGet:
              path: /v1/status
              port: http
            initialDelaySeconds: 10
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /v1/status
              port: http
            periodSeconds: 15
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /v1/status
              port: http
            periodSeconds: 15
            timeoutSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: pageserver-toml
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: pageserver-toml
          configMap:
            name: {{ include "neon-pageserver.configMapName" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "neon-pageserver.selectorLabels" . | nindent 10 }}
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
