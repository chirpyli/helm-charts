apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "neon-pageserver.fullname" . }}
  labels:
    {{- include "neon-pageserver.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "neon-pageserver.headlessServiceName" . }}
  replicas: {{ .Values.replicas }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "neon-pageserver.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "neon-pageserver.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "neon-pageserver.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName | quote }}
      {{- end }}
      initContainers:
        - name: init-metadata
          image: busybox:stable
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              # 初始化 metadata.json（仅在首次创建时写入）
              METADATA_FILE="/data/.neon/metadata.json"
              if [ ! -f "$METADATA_FILE" ]; then
                mkdir -p /data/.neon

                HEADLESS_DNS="${POD_NAME}.{{ include "neon-pageserver.headlessServiceName" . }}.${POD_NAMESPACE}.svc.cluster.local"

                cat > "$METADATA_FILE" << EOF
              {
                "postgres_host": "${HEADLESS_DNS}",
                "postgres_port": 6400,
                "http_host": "${HEADLESS_DNS}",
                "http_port": 9898,
                "grpc_host": "${HEADLESS_DNS}",
                "grpc_port": 50051,
                "https_port": 0,
                "availability_zone_id": "az1"
              }
              EOF

                echo "metadata.json created successfully."
              else
                echo "metadata.json already exists, skipping initialization."
              fi
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - pageserver
            - -D
            - /data/.neon
            - -c
            - /config/pageserver.toml
          env:
            - name: RUST_LOG
              value: "INFO"
            - name: NODE_IP_ADDR
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          envFrom:
            - secretRef:
                name: {{ .Values.s3Credentials.existingSecret }}
          ports:
            - name: pg
              containerPort: 6400
              protocol: TCP
            - name: http
              containerPort: 9898
              protocol: TCP
            - name: grpc
              containerPort: 50051
              protocol: TCP
          startupProbe:
            httpGet:
              path: /status
              port: http
            initialDelaySeconds: 10
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /status
              port: http
            periodSeconds: 15
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /status
              port: http
            periodSeconds: 15
            timeoutSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: pageserver-toml
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: pageserver-toml
          configMap:
            name: {{ include "neon-pageserver.configMapName" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "neon-pageserver.selectorLabels" . | nindent 10 }}
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
