# neon-storage-scrubber 默认配置值。
# 这是一个 YAML 格式的文件。
# 在此声明要传递给模板的变量。

image:
  # -- 镜像仓库
  repository: neondatabase/neon
  # -- 镜像拉取策略
  pullPolicy: IfNotPresent
  # -- 覆盖镜像标签，默认为 Chart 的 appVersion
  tag: ""

# -- 指定 docker-registry 的 Secret 名称数组
imagePullSecrets: []
# -- 部分覆盖 neon-storage-scrubber.fullname 模板的字符串（保留发布名称）
nameOverride: ""
# -- 完全覆盖 neon-storage-scrubber.fullname 模板的字符串
fullnameOverride: ""

serviceAccount:
  # -- 指定是否创建 ServiceAccount
  create: true
  # -- 添加到 ServiceAccount 的注解
  annotations: {}
  # -- 要使用的 ServiceAccount 名称。
  # 如果未设置且 create 为 true，则使用 fullname 模板生成名称
  name: ""

settings:
  # settings.sentryUrl -- URL（将转换为 `SENTRY_DSN` 环境变量），Sentry 用于收集 neon-pg-sni-router 中的错误/panic 事件
  sentryUrl: ""
  # settings.sentryEnvironment -- "development" 或 "production"，在 Sentry 中用于过滤问题
  sentryEnvironment: "development"
  # settings.extraEnvs -- 运行 Job 时的额外环境变量
  extraEnvs:
    - name: RUST_BACKTRACE
      value: "1"
    - name: PAGESERVER_DISABLE_FILE_LOGGING
      value: "1"

storageScrubber:
  # -- 运行 scrubber 的 AWS 区域
  awsRegion: ""
  # -- Pageserver 存储的 AWS Bucket
  awsBucket: ""
  # -- 连接到远程存储的配置对象（可替代前两个变量）
  remoteStorageConfig: {}
  # -- CronJob 的时区
  timeZone: "Etc/UTC"
  # -- CronJob 的调度计划 -- 默认每天下午 6 点运行
  schedule: "0 18 * * *"
  # -- 要执行的命令
  command:
    - pageserver-physical-gc
    - --min-age=1week
  # -- 启用 storage controller 相关功能
  enableStorageControllerConnection: false
  # -- 连接到 storage controller 的 Control Plane / storage controller JWT Token
  storageControllerJwtToken: ""
  # -- Storage Controller 的 URL
  storageControllerUrl: ""
  # -- CronJob 运行的超时时间
  activeDeadlineSeconds: 86400

# -- neon-storage-scrubber Pod 的注解
podAnnotations: {}

# -- neon-storage-scrubber Pod 的标签
podLabels: {}

# -- neon-storage-scrubber Pod 安全上下文
podSecurityContext:
  {}
  # fsGroup: 2000

# -- neon-storage-scrubber 容器安全上下文
securityContext:
  {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

resources:
  limits:
    cpu: 200m
    memory: 2Gi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# -- Pod 节点选择器标签
nodeSelector: {}

# -- Pod 容忍调度配置
tolerations: []

# -- Pod 亲和性调度配置
affinity: {}
