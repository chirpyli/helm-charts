image:
  repository: docker.m.daocloud.io/curlimages/curl
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# 初始化配置
settings:
  storageControllerEndpoint: "http://neon-storage-controller:50051"
  pageserverEndpoint: "http://neon-pageserver:9898"
  # -- 租户和时序线 ID（32 位 hex，不含连字符的 UUID）。
  # 留空则自动生成。如果预设，需同时配置 neon-compute.tenantId / timelineId 保持一致。
  tenantId: ""
  timelineId: ""
  # -- PostgreSQL 主版本号
  pgVersion: 16
  safekeeper:
    replicas: 3
    # -- Safekeeper 节点 ID 基数，注册时 ID = baseId + 序号（与 neon-safekeeper 的 baseId 保持一致）
    baseId: 0
    # -- Safekeeper StatefulSet Pod 名称前缀（由 umbrella chart 覆盖为带 release 前缀的完整名称）
    podNamePrefix: "neon-safekeeper"
    headlessService: "neon-safekeeper-headless"
    pgPort: 5454
    httpPort: 7676

# 生成的输出 ConfigMap
output:
  configMapName: "neon-compute-config"

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

resources:
  limits:
    cpu: "200m"
    memory: 256Mi
  requests:
    cpu: "100m"
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}
extraManifests: []
