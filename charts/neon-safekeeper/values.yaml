# neon-safekeeper 默认配置值。
# 这是一个 YAML 格式的文件。
# 在此声明要传递给模板的变量。

image:
  # -- Neondatabase 镜像仓库
  repository: neondatabase/neon
  # -- 镜像拉取策略
  pullPolicy: Always
  # -- 覆盖镜像标签，默认为 Chart 的 appVersion
  tag: "latest"

# -- 指定 docker-registry 的 Secret 名称数组
imagePullSecrets: []

# -- 部分覆盖 neon-safekeeper.fullname 模板的字符串（保留发布名称）
nameOverride: ""
# -- 完全覆盖 neon-safekeeper.fullname 模板的字符串
fullnameOverride: ""

# StatefulSet 配置
# -- Safekeeper 副本数（推荐 3 个以实现 WAL 法定人数）
replicas: 3
# -- 基础 ID，node_id = baseId + pod_ordinal（MVP: baseId=1, 3 副本 id=1,2,3）
baseId: 1

# Safekeeper 配置
settings:
  # settings.brokerEndpoint -- Storage Broker 端点地址
  brokerEndpoint: "http://neon-storage-broker:50051"
  # settings.listenPg -- PostgreSQL 协议监听地址
  listenPg: "0.0.0.0:5454"
  # settings.listenHttp -- HTTP API 监听地址
  listenHttp: "0.0.0.0:7676"

# 远程存储（S3 / MinIO）
remoteStorage:
  # remoteStorage.prefixInBucket -- S3 Bucket 中的前缀路径
  prefixInBucket: "/safekeeper/"

# S3 凭证配置
s3Credentials:
  # s3Credentials.existingSecret -- 包含 S3 凭证的已有 Secret 名称
  existingSecret: "bucket-credentials"

# 磁盘使用控制
diskUsage:
  # diskUsage.maxGlobalDiskUsageRatio -- 全局磁盘最大使用比例（0=不限制，推荐 0.6~0.8）
  maxGlobalDiskUsageRatio: 0.0
  # diskUsage.maxTimelineDiskUsageBytes -- 单个 timeline 的磁盘使用上限（0=不限制）
  maxTimelineDiskUsageBytes: 0
  # diskUsage.globalDiskCheckInterval -- 全局磁盘检查间隔
  globalDiskCheckInterval: "60s"

# 持久化存储配置
persistence:
  # persistence.enabled -- 是否启用持久化存储
  enabled: true
  # persistence.size -- 持久卷大小
  size: 10Gi

# 网络配置
service:
  # Headless Service 配置（StatefulSet 必须）
  headless:
    # service.headless.name -- Headless Service 名称（空值则自动使用 {release}-neon-safekeeper-headless）
    name: ""

serviceAccount:
  # serviceAccount.create -- 指定是否创建 ServiceAccount
  create: true
  # serviceAccount.annotations -- 添加到 ServiceAccount 的注解
  annotations: {}
  # serviceAccount.name -- 要使用的 ServiceAccount 名称。
  # 如果未设置且 create 为 true，则使用 fullname 模板生成名称
  name: ""

# -- neon-safekeeper Pod 的注解
podAnnotations: {}

# -- neon-safekeeper Pod 的附加标签
podLabels: {}

# -- neon-safekeeper Pod 安全上下文
podSecurityContext: {}

# -- neon-safekeeper 容器安全上下文
securityContext: {}

# -- 资源限制与请求
resources:
  limits:
    cpu: "4"
    memory: 4Gi
  requests:
    cpu: "1"
    memory: 512Mi

# -- Pod 节点选择器标签
nodeSelector: {}

# -- Pod 容忍调度配置
tolerations: []

# -- Pod 亲和性调度配置
affinity: {}

# -- Pod 优先级类
priorityClassName: ""

# -- 随 Chart 一同创建的额外 Kubernetes 资源清单
extraManifests: []
