# safekeeper必须指定id，storage broker地址， 本地盘路径，s3配置（可选）
# 需要注意，safekeeper启动后，需要通过neon-init-job注册到storage controller
apiVersion: apps/v1
kind: StatefulSet      # 有状态服务，需要本地盘
metadata:
  name: {{ include "neon-safekeeper.fullname" . }}
  labels:
    {{- include "neon-safekeeper.labels" . | nindent 4 }}
spec:
  serviceName: {{ default (printf "%s-headless" (include "neon-safekeeper.fullname" .)) .Values.service.headless.name }}
  replicas: {{ .Values.replicas }}
  podManagementPolicy: Parallel    # 并行启动和终止
  selector:
    matchLabels:
      {{- include "neon-safekeeper.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "neon-safekeeper.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "neon-safekeeper.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:    
            - /bin/sh
            - -c
            - |
              SAFEKEEPER_ID=$(({{ .Values.baseId }} + $(echo ${POD_NAME##*-})))
              # 抽取 PG 端口（listenPg 格式为 "0.0.0.0:5454"）
              SAFEKEEPER_PG_PORT=$(echo {{ .Values.settings.listenPg }} | cut -d: -f2)
              # advertise-pg 使用 Pod 的 Headless DNS 名称，使 Pageserver 能正确连接到 Safekeeper
              # 不使用 0.0.0.0（那是监听地址），否则 Pageserver 会尝试连接 localhost
              # Safekeeper 期望 TOML inline table 格式（与 Neon 测试框架 to_toml_inline_table 一致）
              exec safekeeper \
                --listen-pg={{ .Values.settings.listenPg }} \
                --listen-http={{ .Values.settings.listenHttp }} \
                --advertise-pg=${POD_NAME}.${HEADLESS_SVC}:${SAFEKEEPER_PG_PORT} \
                --id=${SAFEKEEPER_ID} \
                --broker-endpoint={{ .Values.settings.brokerEndpoint }} \
                -D /data \
                --remote-storage="{endpoint = \"$(AWS_ENDPOINT_URL)\", bucket_name = \"$(BUCKET_NAME)\", bucket_region = \"$(AWS_REGION)\", prefix_in_bucket = \"{{ .Values.remoteStorage.prefixInBucket }}\"}"
          env:
            - name: RUST_LOG
              value: "INFO"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Headless Service DNS 名（不含命名空间后缀），用于 --advertise-pg
            - name: HEADLESS_SVC
              value: {{ default (printf "%s-headless" (include "neon-safekeeper.fullname" .)) .Values.service.headless.name | quote }}
          envFrom:
            - secretRef:
                name: {{ .Values.s3Credentials.existingSecret }}      # 配置S3
          ports:
            - name: pg
              containerPort: 5454
              protocol: TCP
            - name: http
              containerPort: 7676
              protocol: TCP
          startupProbe:
            httpGet:
              path: /v1/status
              port: http
            initialDelaySeconds: 10
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /v1/status
              port: http
            periodSeconds: 15
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /v1/status
              port: http
            periodSeconds: 15
            timeoutSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
  volumeClaimTemplates:     # 持久化存储，PVC
    - metadata:
        name: data
        labels:
          {{- include "neon-safekeeper.labels" . | nindent 10 }}
      spec:
        accessModes: [ "ReadWriteOnce" ]    # 卷只能被单个节点以读写方式挂载
        {{- if .Values.persistence.enabled }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
        {{- else }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
        {{- end }}
