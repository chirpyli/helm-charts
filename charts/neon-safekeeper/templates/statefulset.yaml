{{/*
共享 JWT Secret 名称：取值链见 _helpers.tpl 的 neon-safekeeper.jwtSecretName。
提前求值并在本文件多处复用（主容器公钥卷、注册 sidecar 的 admin token 卷）。
*/}}
{{- $jwtSecret := include "neon-safekeeper.jwtSecretName" . -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "neon-safekeeper.fullname" . }}
  labels:
    {{- include "neon-safekeeper.labels" . | nindent 4 }}
  {{- with .Values.statefulSetAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  serviceName: {{ include "neon-safekeeper.headlessServiceName" . }}
  replicas: {{ .Values.statefulSet.replicas }}
  selector:
    matchLabels:
      {{- include "neon-safekeeper.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "neon-safekeeper.selectorLabels" . | nindent 8 }}
      {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "neon-safekeeper.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.statefulSet.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # 生成每 pod 唯一的 node id 文件（id = nodeIdBase + StatefulSet ordinal）
      # 同时探测本 Pod 所在节点的可用区，写入 /etc/neon/availability-zone 供主容器与注册 sidecar 使用
      initContainers:
        - name: init-node-id
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              # 1) 动态探测本 Pod 所在节点的可用区（结果写入 shell 变量 AZ）
              #    AZ 不能静态指定：同一份 chart 部署到多可用区集群时，静态值会让所有副本上报同一个 AZ，
              #    storage controller 会据此做出错误的调度决策（timeline 放置、pageserver 选主）。
              {{- include "neon-safekeeper.azLookupScript" . | nindent 14 }}

              # 2) 写入共享 emptyDir，主容器与注册 sidecar 均从此文件读取，保证三处 AZ 完全一致
              mkdir -p /etc/neon
              printf '%s\n' "${AZ}" > /etc/neon/availability-zone
              echo "init-node-id: wrote availability-zone=${AZ}"

              ORD=$(echo "$POD_NAME" | awk -F- '{print $NF}')
              ID=$(( {{ .Values.statefulSet.nodeIdBase }} + ORD ))
              printf '%s' "$ID" > /etc/neon/node-id
              echo "init-node-id: wrote node-id=$ID"
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # 本 Pod 所在节点名，供 init 容器读取节点标签（topology.kubernetes.io/zone）探测可用区
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: node-id
              mountPath: /etc/neon
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # safekeeper 用 clap 参数（无 TOML 配置文件）；--id 来自 init 写入的文件
          # 注意：safekeeper 没有 --listen-grpc、没有 --control-plane-api（经 broker 发现）
          command:
            - sh
            - -c
            - |
              # 可用区：读取 init-node-id 从节点 topology.kubernetes.io/zone 标签探测到的值
              # （不静态指定，保证与注册到 storage controller 的 availability_zone_id 一致）
              AZ="$(cat /etc/neon/availability-zone 2>/dev/null || true)"
              if [ -z "${AZ}" ]; then
                echo "safekeeper: FATAL - 无法读取 /etc/neon/availability-zone，拒绝以空可用区启动"
                exit 1
              fi

              # 构造公告地址：pageserver 通过 broker 发现 safekeeper 时使用此地址连接
              # 若未设置 --advertise-pg，safekeeper 默认使用 --listen-pg (0.0.0.0)，
              # 导致 pageserver 无法连接（Connection refused）
              ADVERTISE_ADDR="$(hostname).{{ include "neon-safekeeper.headlessServiceName" . }}.{{ .Release.Namespace }}.svc.cluster.local"
              safekeeper -D /var/lib/safekeeper \
                --id "$(cat /etc/neon/node-id)" \
                --listen-pg "0.0.0.0:{{ .Values.service.pgPort }}" \
                --advertise-pg "${ADVERTISE_ADDR}:{{ .Values.service.pgPort }}" \
                --listen-http "0.0.0.0:{{ .Values.service.httpPort }}" \
                --broker-endpoint "{{ .Values.settings.brokerEndpoint }}" \
                {{- if $jwtSecret }}
                # 启用 JWT 校验：公钥从共享 Secret 只读挂载（未配置 JWT 时整条参数不下发，safekeeper 退化为无认证）
                --pg-auth-public-key-path /etc/neon/jwt/publicKey.pem \
                {{- end }}
                --availability-zone "${AZ}"
          env:
            - name: RUST_LOG
              value: "INFO"
            - name: RUST_BACKTRACE
              value: "1"
          ports:
            - name: pg
              containerPort: {{ .Values.service.pgPort }}
              protocol: TCP
            - name: http
              containerPort: {{ .Values.service.httpPort }}
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          volumeMounts:
            - name: data
              mountPath: {{ .Values.statefulSet.storage.mountPath }}
            - name: node-id
              mountPath: /etc/neon
            {{- if $jwtSecret }}
            # 共享 JWT 公钥（校验 compute / pageserver 的 WAL 连接 token）
            - name: jwt
              mountPath: /etc/neon/jwt
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.statefulSet.resources | nindent 12 }}
      {{- if .Values.sidecar.enabled }}
        # 注册 sidecar
        # 职责：
        #   1) pod 启动即向 SC 注册本 safekeeper 并设为 active（幂等，可自愈）；
        #   2) 周期对账（reconcile）重新注册 + 确认 active，覆盖 SC 重启/记录丢失/被误改；
        #   3) pod 终止时把本节点标记为 decomissioned，阻止 SC 继续向其调度新 timeline。
        # 说明：SC 没有 delete-safekeeper API，下线唯一方式是 decomissioned；
        #       decomissioned 不会迁移已有 timeline，完整缩容需运维先迁移 timeline 再删 pod。
        - name: sk-register
          securityContext:
            {{- toYaml .Values.sidecar.securityContext | nindent 14 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            # 通过 downward API 拿到 pod 名与命名空间，拼出 headless DNS 地址
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RUST_LOG
              value: "INFO"
          # 挂载与 safekeeper 主容器共享的 node-id 文件，保证注册的 id 与主容器 --id 完全一致
          volumeMounts:
            - name: node-id
              mountPath: /etc/neon
              readOnly: true
            {{- if $jwtSecret }}
            # 注册用的 admin scope token：只投影 peerJwtToken 一个键，
            # 不复用主容器的 jwt 卷，避免同一个容器里同时出现公钥与调用凭据。
            - name: jwt-register
              mountPath: /etc/neon/jwt
              readOnly: true
            {{- end }}
          command:
            - sh
            - -c
            - |
              set -u

              # 读取本 pod 的 safekeeper node id（由 init 容器写入，与主容器 --id 完全一致）
              NODE_ID="$(cat /etc/neon/node-id 2>/dev/null || true)"
              if [ -z "${NODE_ID}" ]; then
                echo "sk-register: FATAL - 无法读取 /etc/neon/node-id，注册 sidecar 退出"
                sleep 3600
                exit 1
              fi

              # SC 地址与 admin scope JWT（peerJwtToken，SC 的 check_permissions 允许 Admin 兜底）
              SC_URL="{{ .Values.settings.storageControllerUrl }}"
              # 从只读挂载的共享 JWT Secret 读取 admin token。
              # 不能像以前那样把 token 内联进这段脚本：内联会让它出现在 Pod spec 的 command 里，
              # `kubectl get pod -o yaml` 就能看到，还会落进审计日志与 GitOps 渲染产物。
              ADMIN_TOKEN="$(cat /etc/neon/jwt/peerJwtToken 2>/dev/null || true)"
              if [ -z "${ADMIN_TOKEN}" ]; then
                echo "sk-register: FATAL - 无法读取 /etc/neon/jwt/peerJwtToken，拒绝以空 token 调用 SC"
                sleep 3600
                exit 1
              fi
              HEADLESS_SVC="{{ include "neon-safekeeper.headlessServiceName" . }}"
              # pod 稳定 DNS = <pod-name>.<headless-svc>.<ns>.svc.cluster.local
              HOST="${POD_NAME}.${HEADLESS_SVC}.${POD_NAMESPACE}.svc.cluster.local"
              PG_PORT={{ .Values.service.pgPort }}
              HTTP_PORT={{ .Values.service.httpPort }}
              # 可用区：读取 init-node-id 从节点 topology.kubernetes.io/zone 标签探测到的值，
              # 与主容器 --availability-zone 同源，保证上报给 SC 的 AZ 与实际运行 AZ 一致
              AZ="$(cat /etc/neon/availability-zone 2>/dev/null || true)"
              if [ -z "${AZ}" ]; then
                echo "sk-register: FATAL - 无法读取 /etc/neon/availability-zone，注册 sidecar 退出"
                sleep 3600
                exit 1
              fi
              REGION="default"

              # 向 SC 注册本 safekeeper 并激活（幂等）
              register_once() {
                local nid="$1"
                # 构造 SafekeeperUpsert 请求体（与 SC 的 SafekeeperUpsert 结构一致）
                local body
                body="{\"id\": ${nid}, \"region_id\": \"${REGION}\", \"version\": 1, \"host\": \"${HOST}\", \"port\": ${PG_PORT}, \"http_port\": ${HTTP_PORT}, \"https_port\": null, \"active\": null, \"availability_zone_id\": \"${AZ}\"}"

                # 1) upsert 注册：POST /control/v1/safekeeper/:id（Scope::Infra，Admin 兜底）
                #    重复注册返回 409 视为成功（记录已存在）
                local code
                code=$(curl -s -o /tmp/reg.txt -w "%{http_code}" -X POST \
                  "${SC_URL}/control/v1/safekeeper/${nid}" \
                  -H "Content-Type: application/json" \
                  -H "Authorization: Bearer ${ADMIN_TOKEN}" \
                  -d "${body}" --connect-timeout 5 --max-time 30) || code="000"
                echo "sk-register: upsert node ${nid} -> HTTP ${code}"

                # 2) 激活调度策略：只有 Active 才会被 SC 调度新 timeline
                #    POST /control/v1/safekeeper/:id/scheduling_policy（Scope::Admin）
                #
                #    注意大小写：上游 SkSchedulingPolicy 只 derive 了 Serialize/Deserialize（无 rename_all），
                #    JSON 反序列化认的是变体名首字母大写形式（"Active"/"Pause"/"Decomissioned"）；
                #    只有 FromStr / 数据库落库才用小写（"active"）。写成小写会被 SC 判 400 拒收，
                #    safekeeper 会一直停在 Activating，SC 永不向其调度 timeline。
                local pcode
                pcode=$(curl -s -o /tmp/pol.txt -w "%{http_code}" -X POST \
                  "${SC_URL}/control/v1/safekeeper/${nid}/scheduling_policy" \
                  -H "Content-Type: application/json" \
                  -H "Authorization: Bearer ${ADMIN_TOKEN}" \
                  -d '{"scheduling_policy":"Active"}' --connect-timeout 5 --max-time 30) || pcode="000"
                echo "sk-register: set active node ${nid} -> HTTP ${pcode}"
              }

              # pod 终止时注销：标记为 decomissioned，避免 SC 继续向其调度新 timeline
              # 注意：decomissioned 不会迁移已有 timeline；完整缩容需运维先迁移 timeline 再删 pod
              deregister() {
                local nid="$1"
                echo "sk-register: pod 终止，将 node ${nid} 标记为 decomissioned"
                # 同样要注意大小写：JSON 里必须是变体名形式 "Decomissioned"（见上方激活处的说明）
                curl -s -o /dev/null -X POST \
                  "${SC_URL}/control/v1/safekeeper/${nid}/scheduling_policy" \
                  -H "Content-Type: application/json" \
                  -H "Authorization: Bearer ${ADMIN_TOKEN}" \
                  -d '{"scheduling_policy":"Decomissioned"}' \
                  --connect-timeout 5 --max-time 10 || true
                echo "sk-register: deregister 完成"
              }

              # 捕获终止信号，先注销再退出（不影响主容器自身的优雅关停）
              trap 'echo "sk-register: 收到终止信号"; deregister "${NODE_ID}"; exit 0' TERM INT

              echo "sk-register: 启动，node=${NODE_ID} host=${HOST}"
              # 启动即注册（若 SC 尚未就绪会失败，下方 reconcile 循环会重试）
              register_once "${NODE_ID}" || true

              # 周期对账：覆盖 SC 重启、记录丢失、被误改为非 active 等情况
              RECONCILE={{ .Values.sidecar.reconcileIntervalSeconds }}
              while true; do
                sleep "${RECONCILE}" &
                wait $!
                register_once "${NODE_ID}" || true
              done
          resources:
            {{- toYaml .Values.sidecar.resources | nindent 14 }}
      {{- end }}
      {{- /*
            Pod 反亲和：强制同一 StatefulSet 的多个 safekeeper 副本调度到不同的 k8s 节点上。
            该规则强制开启、恒为硬约束（requiredDuringSchedulingIgnoredDuringExecution），不可关闭也不可降级。

            为什么必须跨节点：
              1) safekeeper 依赖 WAL 多数派（默认 3 副本容忍 1 副本失效），只有副本分散在不同节点，
                 单节点故障才不会同时打掉多个副本而破坏多数派；
              2) 单机磁盘故障会同时损坏多个副本的 WAL 存储；
              3) 避免副本间争抢同一节点的 CPU / 内存 / 磁盘 IO。

            实现说明：
              - matchLabels 复用 selectorLabels（与 StatefulSet spec.selector 同源），
                只与“本实例、本组件”的 Pod 互斥，不会误伤 pageserver 等其他组件；
              - 内置硬规则先写入 $affinity，再用 mergeOverwrite 合并用户自定义的 .Values.affinity，
                用户配置优先级更高（可覆盖内置规则），同时避免手写拼接产生重复的 podAntiAffinity 键。
            */ -}}
      {{- $term := dict "labelSelector" (dict "matchLabels" (fromYaml (include "neon-safekeeper.selectorLabels" .))) "topologyKey" .Values.podAntiAffinity.topologyKey }}
      {{- $affinity := dict "podAntiAffinity" (dict "requiredDuringSchedulingIgnoredDuringExecution" (list $term)) }}
      {{- with mergeOverwrite (deepCopy $affinity) .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: node-id
          emptyDir: {}
        {{- if $jwtSecret }}
        # 主容器用：只投影校验公钥，不投影任何 token 或私钥
        - name: jwt
          secret:
            secretName: {{ $jwtSecret }}
            items:
              - key: publicKey.pem
                path: publicKey.pem
        # 注册 sidecar 用：只投影 admin scope token
        - name: jwt-register
          secret:
            secretName: {{ $jwtSecret }}
            items:
              - key: peerJwtToken
                path: peerJwtToken
        {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.statefulSet.storage.storageClassName }}
        storageClassName: {{ .Values.statefulSet.storage.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.statefulSet.storage.size }}
