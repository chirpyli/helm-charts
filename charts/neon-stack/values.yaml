# ============================================================
# neon-stack Umbrella Chart 默认配置值
#
# 一站式部署完整 Neon 私有化环境：
#   Storage Controller + Broker + Pageserver + Safekeeper + Compute
#   + Dummy Control Plane + Init Job
#
# 不部署 Control Plane，使用 Storage Controller + 静态 ComputeSpec
# ============================================================

# 全局配置：所有子 Chart 共享的外部依赖引用
global:
  # === 外部 S3（MinIO）— 通过 Secret 引用 ===
  s3:
    # -- 包含 S3 凭证的 Kubernetes Secret 名称
    # 必须包含以下 key：AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
    # AWS_ENDPOINT_URL, AWS_REGION, BUCKET_NAME
    existingSecret: "bucket-credentials"

  # === 外部 PostgreSQL — 通过 Secret 引用 ===
  storageController:
    # -- Storage Controller HTTP API 地址
    endpoint: "http://neon-stack-neon-storage-controller-svc:50051"
    # -- 包含 PostgreSQL 连接串的 Secret 名称（key: uri）
    existingPgUriSecret: "storage-controller-pg-cluster"

  # === Storage Broker ===
  storageBroker:
    # -- Storage Broker gRPC 地址
    endpoint: "http://neon-stack-neon-storage-broker:50051"

  # === Pageserver ===
  pageserver:
    # -- Pageserver ClusterIP Service 地址（单副本时可用）
    host: "neon-stack-neon-pageserver"
    pgPort: 6400
    httpPort: 9898

  # === Safekeeper ===
  safekeeper:
    replicas: 3
    headlessService: "neon-stack-neon-safekeeper-headless"
    pgPort: 5454
    httpPort: 7676

  # === Dummy CP ===
  dummyCp:
    # -- Dummy CP 吸收器地址
    endpoint: "http://neon-stack-neon-dummy-cp:8080"

# ============================================================
# 子 Chart 覆盖配置
# ============================================================

# -- Storage Broker（已有 Chart）
neon-storage-broker:
  enabled: true
  image:
    repository: ghcr.io/neondatabase/neon

# -- Storage Controller（已有 Chart，需要 dev 模式）
neon-storage-controller:
  enabled: true
  image:
    repository: ghcr.io/neondatabase/neon
  settings:
    # 启用 dev 模式：跳过 JWT 等生产安全检查
    devMode: true
    # 指向 dummy-cp 吸收 compute hook 通知
    controlPlaneUrl: "http://neon-stack-neon-dummy-cp:8080"
    # dev 模式下 jwt token 可选
    controlPlaneJwtToken: ""
    # 数据库连接串（指向外部 PostgreSQL，与 global.storageController.existingPgUriSecret 对应）
    databaseUrl: "postgres://storage_controller:storage_controller@192.168.232.128:5432/storage_controller"
    # Safekeeper 数量（dev 模式可 < 3）
    timelineSafekeeperCount: 3
  # 生产安全配置
  ingress:
    enabled: false

# -- Dummy Control Plane（吸收 compute hook 通知）
neon-dummy-cp:
  enabled: true
  # 使用国内镜像源（DaoCloud 代理），避免 Docker Hub 无法访问
  image:
    repository: docker.m.daocloud.io/library/python
    tag: "3.11-slim"

# -- Pageserver（正常模式，非 emergency）
neon-pageserver:
  enabled: true
  replicas: 1
  baseId: 1
  image:
    repository: ghcr.io/neondatabase/neon
  settings:
    brokerEndpoint: "http://neon-stack-neon-storage-broker:50051"
    controlPlaneApi: "http://neon-stack-neon-storage-controller-svc:50051/upcall/v1"
  persistence:
    size: 10Gi
  s3Credentials:
    existingSecret: "bucket-credentials"
  # 强制调度到 worker 节点，避免 control-plane 节点 local-path provisioner 超时
  nodeSelector:
    node-role.kubernetes.io/worker: ""

# -- Safekeeper（WAL 持久化，3 副本）
neon-safekeeper:
  enabled: true
  replicas: 3
  baseId: 1
  image:
    repository: ghcr.io/neondatabase/neon
  settings:
    brokerEndpoint: "http://neon-stack-neon-storage-broker:50051"
  persistence:
    size: 10Gi
  s3Credentials:
    existingSecret: "bucket-credentials"

# -- Init Job（创建 tenant/timeline，注册 safekeeper）
neon-init-job:
  enabled: true
  settings:
    storageControllerEndpoint: "http://neon-stack-neon-storage-controller-svc:50051"
    pageserverEndpoint: "http://neon-stack-neon-pageserver:9898"
    safekeeper:
      replicas: 3
      baseId: 1
      podNamePrefix: "neon-stack-neon-safekeeper"
      headlessService: "neon-stack-neon-safekeeper-headless"
      pgPort: 5454
      httpPort: 7676

# -- Storage Scrubber（S3 存储物理垃圾回收 CronJob）
# 独立模式：直接扫描 S3 bucket，无需 Control Plane 或 Storage Controller。
# Region/Bucket 自动从 s3Credentials.existingSecret 中 BUCKET_NAME / AWS_REGION 获取。
neon-storage-scrubber:
  enabled: true
  image:
    repository: ghcr.io/neondatabase/neon
  # S3 凭证：复用与 pageserver/safekeeper 相同的 bucket-credentials Secret
  s3Credentials:
    existingSecret: "bucket-credentials"
  storageScrubber:
    # 调度计划：每天凌晨 3 点运行（避开业务高峰）
    schedule: "0 3 * * *"
    timeZone: "Asia/Shanghai"
    command:
      - pageserver-physical-gc
      - --min-age=1week
  # 强制调度到 worker 节点
  nodeSelector:
    node-role.kubernetes.io/worker: ""

# -- Compute（PostgreSQL 计算节点）
neon-compute:
  enabled: true
  replicas: 1
  pgVersion: 16
  port: 55433
  devMode: true
  # pageservers 配置：根据 neon-pageserver 的 replicas 自动生成所有 pageserver 连接信息
  # pageserver_connstring 将生成为：
  #   "host=pod-0.headless-svc port=6400,host=pod-1.headless-svc port=6400,..."
  pageservers:
    # -- 与 neon-pageserver.replicas 保持一致
    replicas: 1
    podNamePrefix: "neon-stack-neon-pageserver"
    headlessService: "neon-stack-neon-pageserver-headless"
    port: 6400
  safekeepers:
    - host: "neon-stack-neon-safekeeper-0.neon-stack-neon-safekeeper-headless"
      port: 5454
    - host: "neon-stack-neon-safekeeper-1.neon-stack-neon-safekeeper-headless"
      port: 5454
    - host: "neon-stack-neon-safekeeper-2.neon-stack-neon-safekeeper-headless"
      port: 5454
